<script>
/* ============ storage ============ */
const STORE_KEY="dailyLog.v1";
const DIET_KEY="dietTracker.v1";
const WORKOUT_KEY="workoutTracker.v1";

let db=load();
if(!Array.isArray(db.habits)) db.habits=[];
let cursor=todayStr();
let diaryEditing=false;

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||fresh(); }catch(e){ return fresh(); } }
function fresh(){ return { days:{} }; }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
function readOther(key){ try{ return JSON.parse(localStorage.getItem(key))||null; }catch(e){ return null; } }

function todayStr(){ return fmt(new Date()); }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function shiftDay(n){ const d=parseD(cursor); d.setDate(d.getDate()+n); cursor=fmt(d); render(); }
function round(x){ return Math.round(Number(x)||0); }
function round1(x){ return Math.round((Number(x)||0)*10)/10; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function dayData(date){
  if(!db.days[date]) db.days[date]={ diary:"", todos:[], photos:[] };
  const d=db.days[date];
  if(!Array.isArray(d.todos)) d.todos=[];
  if(!Array.isArray(d.photos)) d.photos=[];
  if(!d.habitDone || typeof d.habitDone!=="object") d.habitDone={};
  return d;
}
// recurring habits active on a given date (date-scoped: shown from addedOn, hidden from removedOn onward)
function activeHabits(date){ return db.habits.filter(h=> h.addedOn<=date && (!h.removedOn || date<h.removedOn)); }

/* ============ IndexedDB (shared, read-only for diet/workout; own store for daily) ============ */
const dbCache={};
function openStore(name){
  return new Promise((res,rej)=>{
    if(dbCache[name]) return res(dbCache[name]);
    const q=indexedDB.open(name,1);
    q.onupgradeneeded=()=>{ try{ if(!q.result.objectStoreNames.contains("photos")) q.result.createObjectStore("photos"); }catch(e){} };
    q.onsuccess=()=>{ dbCache[name]=q.result; res(q.result); };
    q.onerror=()=>rej(q.error);
  });
}
async function idbGet(dbName,id){
  try{
    const d=await openStore(dbName);
    if(!d.objectStoreNames.contains("photos")) return null;
    return await new Promise((res,rej)=>{ const tx=d.transaction("photos","readonly"); const r=tx.objectStore("photos").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  }catch(e){ return null; }
}
async function idbPut(dbName,id,val){ const d=await openStore(dbName); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").put(val,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbDel(dbName,id){ const d=await openStore(dbName); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

/* ============ diet (read-only) ============ */
const MEALS=[{key:"breakfast",name:"아침"},{key:"lunch",name:"점심"},{key:"dinner",name:"저녁"},{key:"snack",name:"간식"}];
function dietDay(date){ const d=readOther(DIET_KEY); return d&&d.days&&d.days[date] ? d.days[date] : null; }
function dietTotals(date){
  const day=dietDay(date); const t={kcal:0,carb:0,protein:0,fat:0}; let count=0;
  if(!day||!day.meals) return {t,count};
  Object.values(day.meals).forEach(list=>(list||[]).forEach(it=>{ t.kcal+=it.kcal||0; t.carb+=it.carb||0; t.protein+=it.protein||0; t.fat+=it.fat||0; count++; }));
  return {t,count};
}
async function renderDiet(){
  const box=document.getElementById("dietBody");
  const {t,count}=dietTotals(cursor);
  const day=dietDay(cursor);
  const hasDiet=readOther(DIET_KEY)!==null;
  if(!hasDiet){ box.innerHTML=`<div class="noneMsg">식단 앱 데이터를 찾을 수 없어요. 같은 브라우저에서 식단 기록 앱을 한 번 열어주세요.</div>`; return; }
  if(count===0 && !(day&&day.diary)){ box.innerHTML=`<div class="noneMsg">이 날 식단 기록이 없어요.</div>`; return; }
  let html=`<div class="kcal">${round(t.kcal).toLocaleString()} <small>kcal</small></div>
    <div class="macros">
      <div class="macro c"><div class="v">${round(t.carb)}g</div><div class="l">탄수화물</div></div>
      <div class="macro p"><div class="v">${round(t.protein)}g</div><div class="l">단백질</div></div>
      <div class="macro f"><div class="v">${round(t.fat)}g</div><div class="l">지방</div></div>
    </div>`;
  if(day&&day.diary) html+=`<div class="wsum" style="margin-top:12px">📖 ${esc(day.diary)}</div>`;
  html+=`<div class="phstrip" id="dietPhotos"></div>`;
  box.innerHTML=html;
  // meal photos: dietPhotos keyed as date__mealKey
  const strip=document.getElementById("dietPhotos");
  for(const m of MEALS){
    const du=await idbGet("dietPhotos", cursor+"__"+m.key);
    if(du){ const w=document.createElement("div"); w.className="tag";
      const im=document.createElement("img"); im.src=du; im.onclick=()=>openViewer(du,m.name+" 사진",null);
      const lb=document.createElement("span"); lb.textContent=m.name; w.appendChild(im); w.appendChild(lb); strip.appendChild(w); }
  }
}

/* ============ workout (read-only) ============ */
function workoutDay(date){ const d=readOther(WORKOUT_KEY); return d&&d.days&&d.days[date] ? d.days[date] : null; }
function fmtDur(M){ M=Number(M)||0; if(!M) return ""; let mm=Math.floor(M); let s=Math.round((M-mm)*60); if(s===60){mm++;s=0;} return s?`${mm}분 ${s}초`:`${mm}분`; }
function workoutSummary(date){
  const day=workoutDay(date); const list=(day&&day.workouts)||[];
  if(!list.length) return "";
  let sc=0,cc=0,cm=0,sm=0,kc=0; const others={};
  list.forEach(w=>{ const mn=Number(w.minutes)||0;
    if(w.type==="cardio"){ cc++; cm+=mn; kc+=Number(w.kcal)||0; }
    else if(w.type==="other"){ const k=w.name||"기타"; others[k]=(others[k]||0)+mn; }
    else { sc++; sm+=mn; } });
  const parts=[];
  if(sc) parts.push(sm?`근력 ${fmtDur(sm)}`:`근력 ${sc}종`);
  if(cc) parts.push(cm?`유산소 ${fmtDur(cm)}`:`유산소 ${cc}종`);
  Object.keys(others).forEach(k=>parts.push(others[k]?`${k} ${fmtDur(others[k])}`:k));
  let t=parts.join(" · ");
  if(kc) t+=` · ${kc}kcal`;
  return t;
}
async function renderWorkout(){
  const box=document.getElementById("workoutBody");
  const hasW=readOther(WORKOUT_KEY)!==null;
  if(!hasW){ box.innerHTML=`<div class="noneMsg">운동 앱 데이터를 찾을 수 없어요. 같은 브라우저에서 운동 기록 앱을 한 번 열어주세요.</div>`; return; }
  const day=workoutDay(cursor);
  const sum=workoutSummary(cursor);
  const body=(day&&day.body)||{};
  const hasBody=(body.weight!=null&&body.weight!=="")||(body.waist!=null&&body.waist!=="");
  const list=(day&&day.workouts)||[];
  if(!list.length && !hasBody && !(day&&day.diary)){ box.innerHTML=`<div class="noneMsg">이 날 운동 기록이 없어요.</div>`; return; }
  let html="";
  html+= sum ? `<div class="wsum">${esc(sum)}</div>` : `<div class="noneMsg">운동 항목 없음</div>`;
  // detail lines
  if(list.length){
    html+=`<div style="margin-top:8px">`;

function workoutDetail(w){

  const p=[]; if(w.weight)p.push(w.weight+"kg"); if(w.reps)p.push(w.reps+"회"); if(w.sets)p.push(w.sets+"세트"); return p.join(" · ");

function fileToDataUrl(file,maxSide=900,quality=0.6){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ let w=img.width,h=img.height; if(Math.max(w,h)>maxSide){ const r=maxSide/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    try{ res(cv.toDataURL("image/jpeg",quality)); }catch(e){ rej(e); } };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; img.src=url; }); }

/* ============ CSV export (식단·운동·데일리 통합, 날짜별 1줄) ============ */
function dietTotalsFor(date, ddb){
  const t={kcal:0,carb:0,protein:0,fat:0};
  const day = ddb && ddb.days && ddb.days[date];
  if(!day || !day.meals) return t;
  Object.values(day.meals).forEach(list => (list||[]).forEach(it => {
    t.kcal+=it.kcal||0; t.carb+=it.carb||0; t.protein+=it.protein||0; t.fat+=it.fat||0;
  }));
  return t;
}
function fmtDurMin(M){ M=Number(M)||0; if(!M) return ""; let mm=Math.floor(M); let s=Math.round((M-mm)*60); if(s===60){mm++;s=0;} return s?(mm+"분 "+s+"초"):(mm+"분"); }
function workoutSummaryFor(date, wdb){
  const day = wdb && wdb.days && wdb.days[date];
  const list = (day && day.workouts) || [];
  if(!list.length) return "";
  let sc=0,cc=0,cm=0,sm=0,kc=0; const others={};
  list.forEach(w => { const mn=Number(w.minutes)||0;
    if(w.type==="cardio"){ cc++; cm+=mn; kc+=Number(w.kcal)||0; }
    else if(w.type==="other"){ const k=w.name||"기타"; others[k]=(others[k]||0)+mn; }
    else { sc++; sm+=mn; } });
  const parts=[];
  if(sc) parts.push(sm ? ("근력 "+fmtDurMin(sm)) : ("근력 "+sc+"종"));
  if(cc) parts.push(cm ? ("유산소 "+fmtDurMin(cm)) : ("유산소 "+cc+"종"));
  Object.keys(others).forEach(k => parts.push(others[k] ? (k+" "+fmtDurMin(others[k])) : k));
  let t = parts.join(" · ");
  if(kc) t += " · "+kc+"kcal";
  return t;
}
function diaryTextOf(own){
  if(own && own.entries && own.entries.length){
    return own.entries.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).map(e=>(e.time?e.time+" ":"")+(e.text||"")).join(" | ");
  }
  return (own && own.diary) || "";
}
// 날짜별 요약 (식단 총량 + 운동요약 + 체중/허리 + 매일체크 + 일기)
function buildSummaryRows(){
  const ddb = readOther(DIET_KEY);
  const wdb = readOther(WORKOUT_KEY);
  const habits = db.habits || [];
  const dateset = {};
  Object.keys(db.days || {}).forEach(d => { dateset[d] = 1; });
  if (ddb && ddb.days) Object.keys(ddb.days).forEach(d => { dateset[d] = 1; });
  if (wdb && wdb.days) Object.keys(wdb.days).forEach(d => { dateset[d] = 1; });
  const dates = Object.keys(dateset).sort();
  const header = ["날짜","칼로리(kcal)","탄수화물(g)","단백질(g)","지방(g)","운동요약","체중(kg)","허리둘레(cm)"]
    .concat(habits.map(h => h.name)).concat(["일기"]);
  const rows = [header];
  dates.forEach(date => {
    const own = db.days[date] || {};
    const done = own.habitDone || {};
    const body = (wdb && wdb.days && wdb.days[date] && wdb.days[date].body) || {};
    const dt = dietTotalsFor(date, ddb);
    const hasDiet = !!(ddb && ddb.days && ddb.days[date]);
    const row = [ date,
      hasDiet ? round(dt.kcal) : "", hasDiet ? round1(dt.carb) : "",
      hasDiet ? round1(dt.protein) : "", hasDiet ? round1(dt.fat) : "",
      workoutSummaryFor(date, wdb),
      (body.weight != null && body.weight !== "") ? body.weight : "",
      (body.waist != null && body.waist !== "") ? body.waist : "" ];
    habits.forEach(h => { const active = h.addedOn <= date && (!h.removedOn || date < h.removedOn); row.push(active ? (done[h.id] ? "O" : "X") : ""); });
    row.push(diaryTextOf(own));
    rows.push(row);
  });
  return rows;
}
// 식단 상세 (음식별 한 줄)
function buildDietRows(){
  const ddb = readOther(DIET_KEY);
  const mealTxt={breakfast:"아침",lunch:"점심",dinner:"저녁",snack:"간식"};
  const srcTxt={ai_estimate:"AI추정",product_confirmed:"제품확인",user_manual:"직접입력"};
  const rows=[["날짜","끼니","음식명","수량","단위","칼로리","탄수화물","단백질","지방","출처"]];
  if(ddb && ddb.days){
    Object.keys(ddb.days).sort().forEach(date=>{
      const m=ddb.days[date].meals||{};
      ["breakfast","lunch","dinner","snack"].forEach(mk=>{
        (m[mk]||[]).forEach(it=>rows.push([date,mealTxt[mk],it.name,it.quantity,it.unit,round(it.kcal),round1(it.carb),round1(it.protein),round1(it.fat),srcTxt[it.source]||it.source||""]));
      });
    });
  }
  return rows;
}
// 운동 상세 (운동별 한 줄)
function buildWorkoutRows(){
  const wdb = readOther(WORKOUT_KEY);
  const typeTxt={strength:"근력",cardio:"유산소",other:"기타"};
  const rows=[["날짜","종류","운동명","무게(kg)","횟수","세트","시간(분)","거리(km)","평균페이스","평균심박수","칼로리"]];
  if(wdb && wdb.days){
    Object.keys(wdb.days).sort().forEach(date=>{
      (wdb.days[date].workouts||[]).forEach(w=>rows.push([date,typeTxt[w.type]||w.type,w.name,w.weight||"",w.reps||"",w.sets||"",w.minutes?round1(w.minutes):"",w.distance||"",w.pace||"",w.hr||"",w.kcal||""]));
    });
  }
  return rows;
}
// 일기 상세 (시간대별 기록)
function buildDiaryRows(){
  const rows=[["날짜","시간","내용"]];
  Object.keys(db.days||{}).sort().forEach(date=>{
    const own=db.days[date]||{};
    const ents=(own.entries&&own.entries.length)?own.entries.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)):(own.diary?[{time:"",text:own.diary}]:[]);
    ents.forEach(e=>rows.push([date,e.time||"",e.text||""]));
  });
  return rows;
}
function csvFromRows(rows){
  return rows.map(r=>r.map(c=>{ const v=String(c==null?"":c); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(",")).join("\n");
}
function downloadBlob(blob, fname){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1200);
}
function exportDailyCsv(){
  const rows=buildSummaryRows();
  if(rows.length<=1){ toast("내보낼 기록이 없어요"); return; }
  downloadBlob(new Blob(["﻿"+csvFromRows(rows)],{type:"text/csv;charset=utf-8"}), "데일리요약_"+todayStr()+".csv");
  toast("요약 CSV를 내려받았어요");
}
function exportExcel(){
  if(typeof XLSX==="undefined"){ toast("Excel 라이브러리 로딩 중… 인터넷 연결 후 잠시 뒤 다시 눌러주세요"); return; }

/* ===== IndexedDB 사진 전체 읽기/비우기 (전체 백업용) ===== */
async function idbAll(dbName){
  try{ const d=await openStore(dbName); if(!d.objectStoreNames.contains("photos")) return {};
    return await new Promise((res,rej)=>{ const tx=d.transaction("photos","readonly"); const out={}; const r=tx.objectStore("photos").openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); });
  }catch(e){ return {}; }
}
async function idbClear(dbName){
  try{ const d=await openStore(dbName); if(!d.objectStoreNames.contains("photos")) return;
    return await new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
  }catch(e){}
}

 + '.day h2{font-size:16px;margin:0 0 8px;}'
 + '.tot{font-size:14px;color:#3a3f47;margin-bottom:4px;background:#f7f8fa;border-radius:10px;padding:10px 12px;}.tot b{font-size:22px;}'
 + '.sh{font-size:13px;color:#6a6f78;margin:14px 0 4px;font-weight:700;}'
 + '.mealrow{display:flex;gap:12px;align-items:flex-start;border-top:1px solid #f0f2f5;padding:10px 0;}'
 + '.mealrow .l{flex:1;min-width:0;}.mealrow .r{flex:0 0 42%;max-width:260px;}.mealrow .r img{width:100%;border-radius:10px;display:block;}'
 + '.mlabel{font-weight:700;font-size:14px;margin-bottom:4px;}'
 + '.food{display:flex;justify-content:space-between;font-size:14px;gap:8px;}.food small{color:#9aa0a8;}.food b{white-space:nowrap;}'
 + '.fmac{font-size:12px;color:#9aa0a8;margin:2px 0 6px;}'
 + '.cardio{font-size:14px;padding:3px 0;}.cardio small{color:#9aa0a8;}'
 + '.none{color:#b3b8bf;font-size:13px;padding:4px 0;}'
 + '@media(max-width:520px){.mealrow{flex-direction:column;}.mealrow .r{max-width:100%;flex:none;}}'
 + '</style></head><body><div class="wrapR">';
const REPORT_FOOT = '<div style="text-align:center;color:#b3b8bf;font-size:12px;margin:16px 0;">데일리 허브에서 생성됨</div></div></body></html>';

async function generateShareReport(){
  let start=document.getElementById("shStart").value, end=document.getElementById("shEnd").value;
  if(!start||!end){ toast("시작/종료 날짜를 선택하세요"); return; }
  if(start>end){ const t=start; start=end; end=t; }
  toast("공유 페이지 만드는 중…");
  const ddb=readOther(DIET_KEY), wdb=readOther(WORKOUT_KEY);
  const mealDefs=[["breakfast","🌅 아침"],["lunch","🍱 점심"],["dinner","🌙 저녁"],["snack","🍪 간식"]];
  const dates=[]; let dcur=new Date(start+"T00:00:00"); const dend=new Date(end+"T00:00:00");
  while(dcur<=dend){ dates.push(fmt(dcur)); dcur.setDate(dcur.getDate()+1); }
  let body="";
  for(const date of dates){
    const dd=ddb&&ddb.days&&ddb.days[date];
    const wd=wdb&&wdb.days&&wdb.days[date];
    let t={kcal:0,carb:0,protein:0,fat:0};
    if(dd&&dd.meals) Object.values(dd.meals).forEach(l=>(l||[]).forEach(it=>{t.kcal+=it.kcal||0;t.carb+=it.carb||0;t.protein+=it.protein||0;t.fat+=it.fat||0;}));
    const cardio=((wd&&wd.workouts)||[]).filter(w=>w.type==="cardio");
    const dObj=new Date(date+"T00:00:00"); const wk=["일","월","화","수","목","금","토"][dObj.getDay()];
    // 끼니별 행 (내용 왼쪽 + 사진 오른쪽)
    let mealsHtml="";
    for(const md of mealDefs){
      const mk=md[0], label=md[1];
      const items=(dd&&dd.meals&&dd.meals[mk])||[];
      let photo=null; try{ photo=await idbGet("dietPhotos", date+"__"+mk); }catch(e){}
      if(!items.length && !photo) continue;
      let its = items.length ? items.map(it=>'<div class="food"><span>'+esc(it.name)+' <small>'+(it.quantity?esc(String(it.quantity))+esc(it.unit||""):"")+'</small></span><b>'+round(it.kcal)+'kcal</b></div><div class="fmac">탄 '+round1(it.carb)+' · 단 '+round1(it.protein)+' · 지 '+round1(it.fat)+'</div>').join("") : '<div class="none">기록 없음</div>';
      mealsHtml += '<div class="mealrow"><div class="l"><div class="mlabel">'+label+'</div>'+its+'</div>'+(photo?'<div class="r"><img src="'+photo+'"></div>':'')+'</div>';
    }
    // 유산소 (내용 + 사진)
    let cardioTxt = cardio.length ? cardio.map(w=>{ const p=[]; if(w.minutes)p.push(fmtDurMin(w.minutes)); if(w.distance)p.push(w.distance+"km"); if(w.pace)p.push(w.pace+"/km"); if(w.hr)p.push("♥"+w.hr); if(w.kcal)p.push(w.kcal+"kcal"); return '<div class="cardio">🏃 '+esc(w.name)+' <small>'+esc(p.join(" · "))+'</small></div>'; }).join("") : '<div class="none">유산소 기록 없음</div>';
    let woPhoto=null; const wids=(wd&&wd.photos)||[]; if(wids.length){ try{ woPhoto=await idbGet("workoutPhotos", wids[0]); }catch(e){} }
    let cardioHtml = '<div class="mealrow"><div class="l">'+cardioTxt+'</div>'+(woPhoto?'<div class="r"><img src="'+woPhoto+'"></div>':'')+'</div>';

    body += '<section class="day"><h2>'+date+' ('+wk+')</h2>'
      + '<div class="tot"><b>'+round(t.kcal)+'</b> kcal · 탄 '+round(t.carb)+'g · 단 '+round(t.protein)+'g · 지 '+round(t.fat)+'g</div>'
      + '<div class="sh">🥗 식단</div>'+(mealsHtml||'<div class="none">식단 기록 없음</div>')
      + '<div class="sh">🏃 유산소</div>'+cardioHtml
      + '</section>';
  }
  const html = REPORT_HEAD + '<h1>운동·식단 리포트</h1><div class="range">'+start+' ~ '+end+'</div>' + body + REPORT_FOOT;
  const fname = "PT공유_"+start+"_"+end+".html";
  try{
    const file=new File([html], fname, {type:"text/html"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"운동·식단 리포트"}); toast("공유 시트를 열었어요"); return; }
  }catch(err){ if(err&&err.name==="AbortError") return; }
  downloadBlob(new Blob([html],{type:"text/html"}), fname);
  toast("공유 페이지를 저장했어요");
}

/* ============ settings / backup ============ */
function openSettings(){ document.getElementById("setBackdrop").classList.add("on"); }
function closeSettings(){ document.getElementById("setBackdrop").classList.remove("on"); }
async function backupExport(){
  const photos={};
  try{ const d=await openStore("dailyPhotos"); await new Promise((res)=>{ const tx=d.transaction("photos","readonly"); const r=tx.objectStore("photos").openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ photos[c.key]=c.value; c.continue(); } else res(); }; r.onerror=()=>res(); }); }catch(e){}
  const blob=new Blob([JSON.stringify({store:db,photos})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`데일리기록_백업_${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast("백업 파일을 내보냈어요");
}
function backupImport(){ document.getElementById("backupInput").click(); }
async function onBackupFile(e){
  const f=e.target.files[0]; if(!f) return;
  try{ const txt=await f.text(); const data=JSON.parse(txt);
    if(data.store) db=data.store; save();
    if(data.photos){ for(const k in data.photos){ await idbPut("dailyPhotos",k,data.photos[k]); } }
    render(); toast("복원했어요");
  }catch(err){ toast("복원에 실패했어요"); }
  e.target.value="";
}

/* ============ render ============ */
function render(){
  const d=parseD(cursor); const wk=["일","월","화","수","목","금","토"][d.getDay()];
  document.getElementById("dLabel").textContent = cursor===todayStr()?"오늘":`${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById("dSub").textContent = `${cursor} (${wk})`;
  renderDiet(); renderWorkout();
  renderHabits(); renderTodos(); renderMyPhotos();
}

/* ============ events ============ */
document.getElementById("prevDay").onclick=()=>shiftDay(-1);
document.getElementById("nextDay").onclick=()=>shiftDay(1);
document.getElementById("dateBtn").onclick=openCalendar;
document.getElementById("openSettings").onclick=openSettings;
document.getElementById("calPrev").onclick=()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); };
document.getElementById("calNext").onclick=()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); };
document.getElementById("calToday").onclick=()=>{ cursor=todayStr(); closeCalendar(); render(); };
document.getElementById("calClose").onclick=closeCalendar;
document.getElementById("setClose").onclick=closeSettings;
document.getElementById("dailyCsvBtn").onclick=exportDailyCsv;
document.getElementById("excelBtn").onclick=exportExcel;
document.getElementById("fullBackupBtn").onclick=exportFull;
document.getElementById("fullRestoreBtn").onclick=pickFull;
document.getElementById("fullInput").addEventListener("change", onFullFile);
document.getElementById("shBtn").onclick=generateShareReport;
(function(){ const sD=new Date(); sD.setDate(sD.getDate()-6); document.getElementById("shStart").value=fmt(sD); document.getElementById("shEnd").value=todayStr(); })();
document.getElementById("backupExport").onclick=backupExport;
document.getElementById("backupImport").onclick=backupImport;
document.getElementById("backupInput").onchange=onBackupFile;
document.getElementById("photoClose").onclick=closeViewer;
document.getElementById("photoDelete").onclick=async()=>{ if(viewerDeleteId==null) return; if(!confirm("이 사진을 삭제할까요?")) return;
  const arr=dayData(cursor).photos; const i=arr.indexOf(viewerDeleteId); if(i>=0) arr.splice(i,1); save(); try{ await idbDel("dailyPhotos",viewerDeleteId); }catch(e){} closeViewer(); renderMyPhotos(); toast("사진을 삭제했어요"); };
document.getElementById("todoAddBtn").onclick=addTodo;
document.getElementById("todoInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addTodo(); });
document.getElementById("habitAddBtn").onclick=addHabit;
document.getElementById("habitInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addHabit(); });
document.getElementById("photoInput").onchange=async(e)=>{ const f=e.target.files[0]; if(!f) return;
  try{ const du=await fileToDataUrl(f); const id="d_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await idbPut("dailyPhotos",id,du); dayData(cursor).photos.push(id); save(); renderMyPhotos(); toast("사진을 저장했어요"); }catch(err){ toast("사진 저장 실패"); }
  e.target.value=""; };
[document.getElementById("calBackdrop"),document.getElementById("setBackdrop"),document.getElementById("photoBackdrop")].forEach(bd=>{
  bd.addEventListener("click",e=>{ if(e.target===bd) bd.classList.remove("on"); });
});

let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),1600); }

render();
<\/script>
</body>
</html>
</script>
<script type="text/html" id="src-diary"><!DOCTYPE html>

<head>

  .backdrop.on{ display:flex; }
  .sheet{ background:#fff; width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
  @media(min-width:560px){ .backdrop{ align-items:center; } .sheet{ border-radius:20px; } }
  .calhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }

<div class="toast" id="toast"></div>

<script>
const STORE_KEY="dailyLog.v1";
const CAL_PROXY="https://solar.slutica.workers.dev";
let db=load();
let cursor=todayStr();
let editingId=null;
let calMonth=null;
const evCache={}; // date -> events (그날 캐시)

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||fresh(); }catch(e){ return fresh(); } }
function fresh(){ return { days:{} }; }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
function todayStr(){ return fmt(new Date()); }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function shiftDay(n){ const d=parseD(cursor); d.setDate(d.getDate()+n); cursor=fmt(d); render(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function genId(){ return "e_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function dayData(date){
  if(!db.days[date]) db.days[date]={};
  const d=db.days[date];
  if(!Array.isArray(d.entries)) d.entries=[];
  // 예전 단일 일기(diary 문자열)를 시간 없는 기록 1개로 이관
  if(d.diary && d.diary.trim()){ d.entries.push({ id:genId(), time:"", text:d.diary, ts:1 }); delete d.diary; save(); }
  return d;
}

/* ---------- schedule (구글 캘린더) ---------- */
async function loadSchedule(force){
  const box=document.getElementById("schedule");
  const date=cursor;
  if(!force && evCache[date]){ renderSchedule(evCache[date]); return; }
  box.innerHTML='<div class="schmsg">일정 불러오는 중…</div>';
  try{
    const r=await fetch(CAL_PROXY,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action:"calendar", date:date}) });
    const d=await r.json();
    if(d.error){
      if(d.error==="no calendar url") box.innerHTML='<div class="schmsg">캘린더가 아직 연결되지 않았어요. (Worker에 GCAL_ICS_URL 설정 필요)</div>';
      else box.innerHTML='<div class="schmsg">일정을 불러오지 못했어요: '+esc(d.error)+'</div>';
      return;
    }
    const evs=d.events||[];
    if(date===cursor){ evCache[date]=evs; renderSchedule(evs); }
  }catch(e){
    box.innerHTML='<div class="schmsg">네트워크 오류로 일정을 못 불러왔어요.</div>';
  }
}
function renderSchedule(evs){
  const box=document.getElementById("schedule");
  if(!evs.length){ box.innerHTML='<div class="schmsg">이 날 일정이 없어요.</div>'; return; }
  box.innerHTML=evs.map(e=>`<div class="ev"><div class="t${e.allDay?" allday":""}">${e.allDay?"종일":esc(e.time||"")}</div><div class="nm">${esc(e.title||"")}</div></div>`).join("");
}

/* ---------- diary: 시간대별 기록 ---------- */
function renderEntries(){
  const box=document.getElementById("entriesBox");
  const list=dayData(cursor).entries.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(!list.length){ box.innerHTML='<div class="schmsg">아직 기록이 없어요. 아래에 작성해 보세요.</div>'; return; }
  let h="";
  list.forEach(e=>{
    if(editingId===e.id){
      h+=`<div class="entry" data-id="${e.id}">
        <div class="ehead"><span class="etime">🕐 ${esc(e.time||"시간 없음")}</span></div>
        <textarea class="eedit">${esc(e.text)}</textarea>
        <div class="diary-actions"><button class="cancel" data-act="cancel">취소</button><button class="save" data-act="save">저장</button></div>
      </div>`;
    } else {
      h+=`<div class="entry" data-id="${e.id}">
        <div class="ehead"><span class="etime">🕐 ${esc(e.time||"시간 없음")}</span>
          <span class="ebtns"><button data-act="edit">수정</button><button class="del" data-act="del">삭제</button></span></div>
        <div class="etext">${esc(e.text)}</div>
      </div>`;
    }
  });
  box.innerHTML=h;
  box.querySelectorAll(".entry").forEach(el=>{
    const id=el.dataset.id;
    el.querySelectorAll("[data-act]").forEach(btn=>{
      btn.onclick=()=>{
        const act=btn.dataset.act;
        const arr=dayData(cursor).entries;
        if(act==="edit"){ editingId=id; renderEntries(); }
        else if(act==="cancel"){ editingId=null; renderEntries(); }
        else if(act==="del"){ if(!confirm("이 기록을 삭제할까요?")) return; const i=arr.findIndex(x=>x.id===id); if(i>=0) arr.splice(i,1); save(); renderEntries(); toast("삭제했어요"); }
        else if(act==="save"){ const ta=el.querySelector(".eedit"); const v=ta.value.trim(); const it=arr.find(x=>x.id===id);
          if(it){ if(v) it.text=v; else { const i=arr.indexOf(it); arr.splice(i,1); } }
          editingId=null; save(); renderEntries(); toast(v?"수정했어요":"삭제했어요"); }
      };
    });
    const ta=el.querySelector(".eedit"); if(ta) setTimeout(()=>ta.focus(),30);
  });
}
function addEntry(){
  const ta=document.getElementById("entryInput"); const v=ta.value.trim(); if(!v) return;
  const now=new Date();
  const time=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  dayData(cursor).entries.push({ id:genId(), time:time, text:v, ts:Date.now() });
  save(); ta.value=""; editingId=null; renderEntries(); toast("기록을 추가했어요");
}

/* ---------- calendar modal ---------- */
function dayHasDiary(ds){ const d=db.days[ds]; return !!d && ((d.entries&&d.entries.length)||(d.diary&&d.diary.trim())); }
function openCalendar(){ const d=parseD(cursor); calMonth=new Date(d.getFullYear(),d.getMonth(),1); renderCalendar(); document.getElementById("calBackdrop").classList.add("on"); }
function closeCalendar(){ document.getElementById("calBackdrop").classList.remove("on"); }
function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  document.getElementById("calTitle").textContent=`${y}년 ${m+1}월`;
  document.getElementById("calDow").innerHTML=["일","월","화","수","목","금","토"].map((w,i)=>`<span style="${i===0?'color:#d64545':(i===6?'color:#2f6bbd':'')}">${w}</span>`).join("");
  const days=document.getElementById("calDays"); days.innerHTML="";
  const startDow=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
  for(let i=0;i<startDow;i++){ const c=document.createElement("div"); c.className="calcell empty"; days.appendChild(c); }
  for(let dd=1;dd<=n;dd++){ const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
    const c=document.createElement("div"); c.className="calcell";
    if(ds===cursor) c.classList.add("sel"); else if(ds===todayStr()) c.classList.add("today");
    c.innerHTML=`<span>${dd}</span>`+(dayHasDiary(ds)?`<span class="dot"></span>`:"");
    c.onclick=()=>{ cursor=ds; closeCalendar(); render(); };
    days.appendChild(c);
  }
}

/* ---------- render ---------- */
function render(){
  const d=parseD(cursor); const wk=["일","월","화","수","목","금","토"][d.getDay()];
  document.getElementById("dLabel").textContent = cursor===todayStr()?"오늘":`${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById("dSub").textContent = `${cursor} (${wk})`;
  editingId=null; renderEntries();
  loadSchedule(false);
}

document.getElementById("prevDay").onclick=()=>shiftDay(-1);
document.getElementById("nextDay").onclick=()=>shiftDay(1);
document.getElementById("dateBtn").onclick=openCalendar;
document.getElementById("calRefresh").onclick=()=>loadSchedule(true);
document.getElementById("entryAddBtn").onclick=addEntry;
document.getElementById("calPrev").onclick=()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); };
document.getElementById("calNext").onclick=()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); };
document.getElementById("calToday").onclick=()=>{ cursor=todayStr(); closeCalendar(); render(); };
document.getElementById("calClose").onclick=closeCalendar;
document.getElementById("calBackdrop").addEventListener("click",e=>{ if(e.target.id==="calBackdrop") closeCalendar(); });

let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),1600); }

render();
<\/script>

  .toast.on{ opacity:1; }
</style>

<div class="wrap">
  <div class="datebar">
    <button class="nav" id="prevDay">‹</button>

<div class="toast" id="toast"></div>

<script>
const MEALS = [
  {key:"breakfast", emo:"🌅", name:"아침"},
  {key:"lunch",     emo:"🍱", name:"점심"},
  {key:"dinner",    emo:"🌙", name:"저녁"},
  {key:"snack",     emo:"🍪", name:"간식"},
];
const STORE_KEY = "dietTracker.v1";
const SOLAR_PROXY = "https://solar.slutica.workers.dev"; // Cloudflare Worker (Solar 영양성분 자동 채우기)

let db = load();
if(!db.custom) db.custom={};   // migrate older saved data
if(!db.settings) db.settings=fresh().settings;
if(!db.settings.guides){       // migrate single guide -> date-scoped history
  db.settings.guides={};
  if(db.settings.guide) db.settings.guides["1970-01-01"]=db.settings.guide;
}
let cursor = todayStr();
let activeMeal = null;
let pendingItems = [];   // items awaiting confirm

function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || fresh(); }
  catch(e){ return fresh(); }
}
function fresh(){
  return { days:{}, custom:{}, settings:{ kcalGoalEnabled:true, dailyGoalKcal:2000, proteinGoalEnabled:true, dailyGoalProtein:100 } };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }

// saved-value memory: normalize a food/product name so spacing & case differences still match
function normKey(name){ return String(name||"").trim().toLowerCase().replace(/\s+/g,""); }
function applySaved(it){
  const k=normKey(it.name);
  let c=db.custom[k];
  if(!c){ for(const kk in db.custom){ if(normKey(db.custom[kk].name)===k){ c=db.custom[kk]; break; } } }
  if(!c) return it;
  it.quantity=c.quantity; it.unit=c.unit;
  it.kcal=c.kcal; it.carb=c.carb; it.protein=c.protein; it.fat=c.fat;
  it.base={ q:c.quantity, kcal:c.kcal, carb:c.carb, protein:c.protein, fat:c.fat };
  it.source="user_manual"; it.isProduct=false; it.saved=true;
  return it;
}
function rememberItem(it){
  const b=it.base||{ q:it.quantity, kcal:it.kcal, carb:it.carb, protein:it.protein, fat:it.fat };
  db.custom[normKey(it.name)] = {
    name:it.name, quantity:b.q, unit:it.unit,
    kcal:round1(b.kcal), carb:round1(b.carb), protein:round1(b.protein), fat:round1(b.fat)
  };
}

function todayStr(){ const d=new Date(); return fmt(d); }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function shiftDay(n){ const d=parseD(cursor); d.setDate(d.getDate()+n); cursor=fmt(d); render(); }

function dayData(date){
  if(!db.days[date]) db.days[date]={ meals:{breakfast:[],lunch:[],dinner:[],snack:[]} };
  const m=db.days[date].meals;
  ["breakfast","lunch","dinner","snack"].forEach(k=>{ if(!m[k]) m[k]=[]; });
  return db.days[date];
}
function round(x){ return Math.round((Number(x)||0)); }
function round1(x){ return Math.round((Number(x)||0)*10)/10; }

function dayTotals(date){
  const d=dayData(date); let t={kcal:0,carb:0,protein:0,fat:0};
  Object.values(d.meals).forEach(list=>list.forEach(it=>{
    t.kcal+=it.kcal; t.carb+=it.carb; t.protein+=it.protein; t.fat+=it.fat;
  }));
  return t;
}

/* ---------- rendering ---------- */
/* ---------- calendar ---------- */
let calMonth=null;
function dayHasData(ds){ const day=db.days[ds]; return !!day && ["breakfast","lunch","dinner","snack"].some(k=>(day.meals[k]||[]).length>0); }
function openCalendar(){ const d=parseD(cursor); calMonth=new Date(d.getFullYear(),d.getMonth(),1); renderCalendar(); document.getElementById("calBackdrop").classList.add("on"); }
function closeCalendar(){ document.getElementById("calBackdrop").classList.remove("on"); }
function changeCalMonth(delta){ calMonth.setMonth(calMonth.getMonth()+delta); renderCalendar(); }
function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  document.getElementById("calTitle").textContent=`${y}년 ${m+1}월`;
  document.getElementById("calDow").innerHTML=["일","월","화","수","목","금","토"]
    .map((w,i)=>`<span style="${i===0?'color:#d64545':(i===6?'color:#2f6bbd':'')}">${w}</span>`).join("");
  const days=document.getElementById("calDays"); days.innerHTML="";
  const startDow=new Date(y,m,1).getDay();
  const nDays=new Date(y,m+1,0).getDate();
  for(let i=0;i<startDow;i++){ const c=document.createElement("div"); c.className="calcell empty"; days.appendChild(c); }
  for(let dd=1; dd<=nDays; dd++){
    const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
    const c=document.createElement("div"); c.className="calcell";
    if(ds===cursor) c.classList.add("sel");
    else if(ds===todayStr()) c.classList.add("today");
    c.innerHTML=`<span>${dd}</span>`+(dayHasData(ds)?`<span class="dot"></span>`:"");
    c.onclick=()=>{ cursor=ds; closeCalendar(); render(); };
    days.appendChild(c);
  }
}

// guide in effect for a date = the most recent guide set on or before that date
function guideForDate(date){
  const g=db.settings.guides||{}; let bestKey=null;
  for(const k in g){ if(k<=date && (bestKey===null || k>bestKey)) bestKey=k; }
  return bestKey===null ? "" : (g[bestKey]||"");
}
function render(){
  const d=parseD(cursor);
  const wk=["일","월","화","수","목","금","토"][d.getDay()];
  document.getElementById("dLabel").textContent = cursor===todayStr() ? "오늘" : `${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById("dSub").textContent = `${cursor} (${wk})`;

  // diet guide banner — whichever guide is in effect on this date
  const guide=guideForDate(cursor).trim();
  const gbox=document.getElementById("guideBox");
  if(guide){ document.getElementById("guideText").textContent=guide; gbox.style.display="flex"; }
  else gbox.style.display="none";

  const t=dayTotals(cursor);
  document.getElementById("totKcal").textContent = round(t.kcal).toLocaleString();
  document.getElementById("totCarb").textContent = round(t.carb);
  document.getElementById("totProt").textContent = round(t.protein);
  document.getElementById("totFat").textContent  = round(t.fat);

  // goals
  const g=document.getElementById("goals"); g.innerHTML="";
  const s=db.settings;
  if(s.kcalGoalEnabled) g.appendChild(goalBar("k","칼로리", round(t.kcal), s.dailyGoalKcal, "kcal"));
  if(s.proteinGoalEnabled) g.appendChild(goalBar("pr","단백질", round(t.protein), s.dailyGoalProtein, "g"));

  // meals
  const mc=document.getElementById("meals"); mc.innerHTML="";
  MEALS.forEach(m=>{
    const list=dayData(cursor).meals[m.key];
    const sub=list.reduce((a,it)=>a+it.kcal,0);
    const el=document.createElement("div"); el.className="meal";
    let itemsHtml = list.length ? list.map((it,i)=>itemRow(m.key,it,i)).join("")
                                : `<div class="empty">아직 기록이 없어요</div>`;
    el.innerHTML = `
      <header>
        <div><span class="name"><span class="emo">${m.emo}</span>${m.name}</span>
        <span class="sub">${round(sub)} kcal</span></div>
        <div class="hact">
          <button class="mphoto" data-meal="${m.key}" aria-label="사진">📷</button>
          <button class="add" data-meal="${m.key}">+ 추가</button>
        </div>
      </header>
      <div class="items">${itemsHtml}</div>`;
    mc.appendChild(el);
  });

  document.querySelectorAll(".add").forEach(b=>b.onclick=()=>openAdd(b.dataset.meal));
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    const {meal,idx}=b.dataset; dayData(cursor).meals[meal].splice(Number(idx),1); save(); render();
  });
  document.querySelectorAll(".mphoto").forEach(b=>b.onclick=()=>{
    const mk=b.dataset.meal;
    if(b.classList.contains("has")) openPhotoViewer(mk); else pickPhoto(mk);
  });
  MEALS.forEach(m=>loadMealPhoto(m.key));

  diaryEditing=false;
  renderDiary();
}
/* ---------- diet diary (per date) ---------- */
let diaryEditing=false;
function renderDiary(){
  const box=document.getElementById("diaryBox");
  const text=(dayData(cursor).diary||"");
  if(diaryEditing){
    box.innerHTML=`<div class="diary">
      <div class="diary-title">📖 식단 일기</div>
      <textarea id="diaryInput" placeholder="오늘 식단은 어땠나요? 컨디션·포만감·특이사항 등을 적어보세요."></textarea>
      <div class="diary-actions"><button class="cancel" id="diaryCancel">취소</button><button class="save" id="diarySave">저장</button></div>
    </div>`;
    const ta=document.getElementById("diaryInput"); ta.value=text;
    document.getElementById("diaryCancel").onclick=()=>{ diaryEditing=false; renderDiary(); };
    document.getElementById("diarySave").onclick=()=>{
      const v=ta.value.trim();
      if(v) dayData(cursor).diary=v; else delete dayData(cursor).diary;
      save(); diaryEditing=false; renderDiary(); toast(v?"일기를 저장했어요":"일기를 비웠어요");
    };
    setTimeout(()=>ta.focus(),50);
  } else if(text){
    box.innerHTML=`<div class="diary">
      <div class="diary-head"><span class="diary-title">📖 식단 일기</span>
        <span class="diary-btns"><button id="diaryEdit">수정</button><button class="del" id="diaryDelete">삭제</button></span></div>
      <div class="diary-text">${esc(text)}</div>
    </div>`;
    document.getElementById("diaryEdit").onclick=()=>{ diaryEditing=true; renderDiary(); };
    document.getElementById("diaryDelete").onclick=()=>{
      if(!confirm("이 날의 일기를 삭제할까요?")) return;
      delete dayData(cursor).diary; save(); renderDiary(); toast("일기를 삭제했어요");
    };
  } else {
    box.innerHTML=`<button class="diary-write" id="diaryWrite">＋ 식단 일기 쓰기</button>`;
    document.getElementById("diaryWrite").onclick=()=>{ diaryEditing=true; renderDiary(); };
  }
}
function goalBar(cls,label,cur,goal,unit){
  const pct=goal>0?Math.min(100,Math.round(cur/goal*100)):0;
  const over=cur>goal && goal>0;
  const div=document.createElement("div"); div.className="goal "+cls;
  div.innerHTML=`<div class="row"><span>${label}</span><span>${cur.toLocaleString()} / ${Number(goal).toLocaleString()}${unit}${over?" ⚠":""}</span></div>
    <div class="bar${over?" over":""}"><i style="width:${pct}%"></i></div>`;
  return div;
}
function badge(src){
  if(src==="product_confirmed") return `<span class="badge prod">제품</span>`;
  if(src==="user_manual") return `<span class="badge manual">직접</span>`;
  return `<span class="badge est">추정</span>`;
}
function itemRow(meal,it,idx){
  const q = it.quantity && it.unit ? `${it.quantity}${it.unit} · ` : "";
  return `<div class="item">
    <div class="info">
      <div class="fn">${esc(it.name)}${badge(it.source)}</div>
      <div class="fd">${q}탄 ${round1(it.carb)}g · 단 ${round1(it.protein)}g · 지 ${round1(it.fat)}g</div>
    </div>
    <div class="kc">${round(it.kcal)} kcal</div>
    <button class="del" data-meal="${meal}" data-idx="${idx}">×</button>
  </div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- add flow (manual entry) ---------- */
let formBase=null;   // canonical per-serving values (for quantity scaling)

function openAdd(meal){
  activeMeal=meal;
  const m=MEALS.find(x=>x.key===meal);
  document.getElementById("addTitle").textContent = `${m.emo} ${m.name} 추가`;
  resetForm();
  document.getElementById("addBackdrop").classList.add("on");
  setTimeout(()=>document.getElementById("fName").focus(),100);
}
function closeAdd(){ document.getElementById("addBackdrop").classList.remove("on"); }

function resetForm(){
  formBase=null;
  document.getElementById("fName").value="";
  document.getElementById("fQty").value=1;
  document.getElementById("fUnit").value="개";
  ["fKcal","fCarb","fProt","fFat"].forEach(id=>document.getElementById(id).value=0);
  document.getElementById("autofillNote").style.display="none";
  hideSuggest();
}
function hideSuggest(){ const b=document.getElementById("nameSuggest"); b.style.display="none"; b.innerHTML=""; }
function fillValues(c){
  document.getElementById("fQty").value=c.quantity;
  document.getElementById("fUnit").value=c.unit;
  document.getElementById("fKcal").value=round(c.kcal);
  document.getElementById("fCarb").value=round1(c.carb);
  document.getElementById("fProt").value=round1(c.protein);
  document.getElementById("fFat").value=round1(c.fat);
  formBase={ q:Number(c.quantity)||1, kcal:+c.kcal||0, carb:+c.carb||0, protein:+c.protein||0, fat:+c.fat||0 };
  document.getElementById("autofillNote").style.display="block";
}
function fillFromSaved(c){ document.getElementById("fName").value=c.name; fillValues(c); hideSuggest(); }

// live partial-match suggestions from saved foods
function onNameInput(){
  document.getElementById("autofillNote").style.display="none";
  formBase=null;
  renderSuggest(document.getElementById("fName").value);
}
function renderSuggest(q){
  const box=document.getElementById("nameSuggest");
  const key=normKey(q);
  if(!key){ hideSuggest(); return; }
  const matches=Object.values(db.custom)
    .filter(c=>normKey(c.name).includes(key))
    .sort((a,b)=>a.name.localeCompare(b.name,"ko"))
    .slice(0,8);
  if(!matches.length){ hideSuggest(); return; }
  box.innerHTML="";
  matches.forEach(c=>{
    const row=document.createElement("div"); row.className="s";
    row.innerHTML=`<span class="sn">${esc(c.name)}</span><span class="sk">${round(c.kcal)}kcal · ${c.quantity}${esc(c.unit)}</span>`;
    row.onclick=()=>fillFromSaved(c);
    box.appendChild(row);

const CHO2G={'ㄱ':'가','ㄲ':'가','ㄴ':'나','ㄷ':'다','ㄸ':'다','ㄹ':'라','ㅁ':'마','ㅂ':'바','ㅃ':'바','ㅅ':'사','ㅆ':'사','ㅇ':'아','ㅈ':'자','ㅉ':'자','ㅊ':'차','ㅋ':'카','ㅌ':'타','ㅍ':'파','ㅎ':'하'};
const GORDER=['가','나','다','라','마','바','사','아','자','차','카','타','파','하','#'];
function groupOf(name){
  const ch=(name||"").trim().charAt(0);

  const code=ch.charCodeAt(0);
  if(code>=0xAC00 && code<=0xD7A3) return CHO2G[CHO[Math.floor((code-0xAC00)/588)]]||"#";
  if(CHO2G[ch]) return CHO2G[ch];
  return "#";
}

/* ---------- meal photos (IndexedDB) ---------- */
let _pdb=null, photoTargetMeal=null, viewerMeal=null;
function pdb(){
  return new Promise((resolve,reject)=>{
    if(_pdb) return resolve(_pdb);
    const req=indexedDB.open("dietPhotos",1);
    req.onupgradeneeded=()=>req.result.createObjectStore("photos");
    req.onsuccess=()=>{ _pdb=req.result; resolve(_pdb); };
    req.onerror=()=>reject(req.error);
  });
}
async function photoPut(id,dataUrl){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").put(dataUrl,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function photoGet(id){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readonly"); const r=tx.objectStore("photos").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function photoDel(id){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function photoAll(){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readonly"); const out={}; const r=tx.objectStore("photos").openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); }); }
async function photoClearAll(){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function photoKey(mk){ return cursor+"__"+mk; }

// downscale + compress so photos stay small
function fileToDataUrl(file, maxSide=720, quality=0.5){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(Math.max(w,h)>maxSide){ const r=maxSide/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{ resolve(cv.toDataURL("image/jpeg",quality)); }catch(e){ reject(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("img load")); };
    img.src=url;
  });
}

/* ---------- share day as image card ---------- */
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function F(sz,w){ return (w||"400")+" "+sz+"px -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"; }
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function ellipsize(ctx,text,maxW,font){ ctx.font=font; if(ctx.measureText(text).width<=maxW) return text; let s=text; while(s.length>1 && ctx.measureText(s+"…").width>maxW) s=s.slice(0,-1); return s+"…"; }
function drawCover(ctx,img,x,y,w,h,r){
  ctx.save(); rrect(ctx,x,y,w,h,r); ctx.clip();
  const ir=img.width/img.height, tr=w/h; let sw,sh,sx,sy;
  if(ir>tr){ sh=img.height; sw=sh*tr; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/tr; sx=0; sy=(img.height-sh)/2; }
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h); ctx.restore();
}
function wrapLines(ctx,text,font,firstW,restW){
  ctx.font=font;
  const lines=[]; let cur="", maxW=firstW;
  for(const ch of text){
    const test=cur+ch;
    if(cur!=="" && ctx.measureText(test).width>maxW){ lines.push(cur); cur=ch; maxW=restW; }
    else cur=test;
  }
  if(cur!=="") lines.push(cur);
  return lines.length?lines:[""];
}
async function generateShareCard(){
  const S=2, LW=420, M=16, CP=20;
  const NAMEH=16, MACROH=15, FOODGAP=7, MEALHEADH=22, MEALGAP=10, IND=6, KCALW=66;
  const cardX=M, innerX=cardX+CP, cardW=LW-2*M, innerW=cardW-2*CP, innerR=innerX+innerW;
  const t=dayTotals(cursor);
  const d=parseD(cursor), wk=["일","월","화","수","목","금","토"][d.getDay()];
  const dateLabel=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} (${wk})`;
  const meals=MEALS.map(m=>{ const list=dayData(cursor).meals[m.key]; return {m,list,sub:list.reduce((a,it)=>a+it.kcal,0)}; });
  const mealsWith=meals.filter(x=>x.list.length>0);
  const photos=[];
  for(const m of MEALS){ let du=null; try{ du=await photoGet(photoKey(m.key)); }catch(e){} if(du){ try{ photos.push({m,img:await loadImg(du)}); }catch(e){} } }

  const cv=document.createElement("canvas");
  const ctx=cv.getContext("2d");
  cv.width=LW*S; cv.height=10; ctx.scale(S,S);   // temp size just for measuring

  // per-meal: totals + per-food rows (food name may wrap)
  const mealRender=mealsWith.map(ml=>{
    let carb=0,protein=0,fat=0;
    ml.list.forEach(it=>{ carb+=it.carb; protein+=it.protein; fat+=it.fat; });
    const foods=ml.list.map(it=>({
      name:it.name, kcal:round(it.kcal), carb:round1(it.carb), protein:round1(it.protein), fat:round1(it.fat),
      nameLines:wrapLines(ctx, it.name, F(13), innerW-IND, innerW-IND)
    }));
    return { m:ml.m, sub:round(ml.sub), carb:round(carb), protein:round(protein), fat:round(fat), foods };
  });

  // height
  let h=M+CP+46+14+46;
  if(photos.length) h+=16+84+18;
  h+=14+1+12;
  if(mealRender.length){
    mealRender.forEach(mr=>{ h+=MEALHEADH; mr.foods.forEach(fd=>{ h+=fd.nameLines.length*NAMEH+MACROH+FOODGAP; }); h+=MEALGAP; });
  } else h+=24;
  h+=CP+M;
  const LH=h;

  cv.height=LH*S; ctx.setTransform(1,0,0,1,0,0); ctx.scale(S,S); ctx.textBaseline="alphabetic";

  ctx.fillStyle="#eef0f3"; ctx.fillRect(0,0,LW,LH);
  rrect(ctx,cardX,M,cardW,LH-2*M,16); ctx.fillStyle="#ffffff"; ctx.fill();
  ctx.strokeStyle="#e8ebf0"; ctx.lineWidth=1; ctx.stroke();

  let y=M+CP;
  // header
  ctx.textAlign="left"; ctx.fillStyle="#8a8f98"; ctx.font=F(13); ctx.fillText("식단 기록", innerX, y+13);
  ctx.fillStyle="#1c1e21"; ctx.font=F(18,"600"); ctx.fillText(dateLabel, innerX, y+36);
  ctx.textAlign="right"; ctx.fillStyle="#1c1e21"; ctx.font=F(30,"700"); ctx.fillText(round(t.kcal).toLocaleString(), innerR, y+30);
  ctx.font=F(12); ctx.fillStyle="#8a8f98"; ctx.fillText("kcal", innerR, y+44);
  ctx.textAlign="left";
  y+=46+14;
  // macros
  const chips=[["탄수화물",round(t.carb),"#FBF1E0","#B9791F"],["단백질",round(t.protein),"#FCEAEC","#C0455E"],["지방",round(t.fat),"#E9F1FB","#2F6BBD"]];
  const cw=(innerW-16)/3;
  chips.forEach((c,i)=>{ const x=innerX+i*(cw+8); rrect(ctx,x,y,cw,46,8); ctx.fillStyle=c[2]; ctx.fill();
    ctx.textAlign="center"; ctx.fillStyle=c[3]; ctx.font=F(15,"700"); ctx.fillText(c[1]+"g", x+cw/2, y+21);
    ctx.font=F(11); ctx.fillText(c[0], x+cw/2, y+37); });
  ctx.textAlign="left";
  y+=46;
  // photos
  if(photos.length){
    y+=16; const n=photos.length, pw=(innerW-(n-1)*8)/n, ph=84;
    photos.forEach((p,i)=>{ const x=innerX+i*(pw+8); drawCover(ctx,p.img,x,y,pw,ph,8);
      ctx.textAlign="center"; ctx.fillStyle="#8a8f98"; ctx.font=F(11); ctx.fillText(p.m.emo+" "+p.m.name, x+pw/2, y+ph+14); });
    ctx.textAlign="left"; y+=84+18;
  }
  y+=14;
  ctx.strokeStyle="#f0f2f5"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(innerX,y); ctx.lineTo(innerR,y); ctx.stroke();
  y+=1+12;
  // per-meal breakdown
  if(mealRender.length){
    mealRender.forEach(mr=>{
      // meal header: name + macros summary (darker)
      ctx.textAlign="left"; ctx.fillStyle="#1c1e21"; ctx.font=F(14,"600"); ctx.fillText(`${mr.m.emo} ${mr.m.name}`, innerX, y+14);
      ctx.textAlign="right"; ctx.fillStyle="#565b63"; ctx.font=F(12); ctx.fillText(`${mr.sub} kcal · 탄 ${mr.carb} · 단 ${mr.protein} · 지 ${mr.fat}`, innerR, y+14);
      ctx.textAlign="left"; y+=MEALHEADH;
      // foods: name line, then "kcal · 탄 · 단 · 지" on one muted line
      mr.foods.forEach(fd=>{
        ctx.textAlign="left"; ctx.fillStyle="#1c1e21"; ctx.font=F(13);
        fd.nameLines.forEach((ln,i)=>ctx.fillText(ln, innerX+IND, y+13+i*NAMEH));
        const yy=y+fd.nameLines.length*NAMEH;
        ctx.fillStyle="#a3a8af"; ctx.font=F(11); ctx.fillText(`${fd.kcal} kcal · 탄 ${fd.carb} · 단 ${fd.protein} · 지 ${fd.fat} (g)`, innerX+IND, yy+11);
        y=yy+MACROH+FOODGAP;
      });
      y+=MEALGAP;
    });
  } else {
    ctx.textAlign="center"; ctx.fillStyle="#b3b8bf"; ctx.font=F(14); ctx.fillText("이 날은 기록이 없어요", innerX+innerW/2, y+14); ctx.textAlign="left"; y+=24;
  }
  return await new Promise(res=>cv.toBlob(res,"image/png",0.92));
}

      await navigator.share({ files:[file], title:"식단 기록", text:`${cursor} 식단 기록` });
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast("이미지를 저장했어요");
    }
  }catch(e){ console.error(e); toast("공유에 실패했어요"); }
}

/* ---------- backup / restore (for iCloud Drive sync) ---------- */
async function exportBackup(){
  toast("백업 파일 만드는 중…");
  let photos={}; try{ photos=await photoAll(); }catch(e){}
  const payload={ app:"diet-tracker", version:1, exportedAt:new Date().toISOString(), data:db, photos };
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const fname=`식단백업_${todayStr()}.json`;
  const file=new File([blob], fname, {type:"application/json"});
  // prefer the iOS share sheet -> "파일에 저장" -> iCloud Drive
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({ files:[file], title:"식단 백업" }); toast("공유 시트 → '파일에 저장' → iCloud Drive"); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  // fallback: plain download
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("백업 내보냄 · '기타…' → 파일에 저장 → iCloud Drive");
}
function pickBackup(){ const inp=document.getElementById("backupInput"); inp.value=""; inp.click(); }
async function onBackupPicked(){
  const inp=document.getElementById("backupInput");
  const f=inp.files && inp.files[0]; if(!f) return;
  try{
    const obj=JSON.parse(await f.text());
    if(!obj || obj.app!=="diet-tracker" || !obj.data){ toast("올바른 백업 파일이 아니에요"); return; }
    const when=obj.exportedAt? new Date(obj.exportedAt).toLocaleString("ko-KR") : "알 수 없음";
    if(!confirm(`이 백업으로 현재 기기의 기록을 덮어씁니다.\n\n백업 시점: ${when}\n\n계속할까요?`)) return;
    db=obj.data;
    if(!db.custom) db.custom={};
    if(!db.settings) db.settings=fresh().settings;
    if(!db.days) db.days={};
    save();
    try{
      await photoClearAll();
      if(obj.photos){ for(const k in obj.photos){ await photoPut(k, obj.photos[k]); } }
    }catch(e){ console.error("photo restore", e); }
    document.getElementById("setBackdrop").classList.remove("on");
    render();
    toast("복원했어요");
  }catch(e){ console.error(e); toast("가져오기에 실패했어요"); }
}

/* ---------- CSV ---------- */
function exportCsv(){
  const rows=[["날짜","끼니","음식명","수량","단위","칼로리","탄수화물","단백질","지방","출처"]];
  const srcTxt={ai_estimate:"AI추정",product_confirmed:"제품확인",user_manual:"직접입력"};
  const mealTxt={breakfast:"아침",lunch:"점심",dinner:"저녁",snack:"간식"};
  Object.keys(db.days).sort().forEach(date=>{
    ["breakfast","lunch","dinner","snack"].forEach(mk=>{
      (db.days[date].meals[mk]||[]).forEach(it=>{
        rows.push([date,mealTxt[mk],it.name,it.quantity,it.unit,round(it.kcal),round1(it.carb),round1(it.protein),round1(it.fat),srcTxt[it.source]||it.source]);
      });
    });
  });
  if(rows.length===1){ toast("내보낼 기록이 없어요"); return; }
  const csv=rows.map(r=>r.map(c=>{ const v=String(c); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(",")).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`식단기록_${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(url); toast("CSV를 내려받았어요");
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800);
}

/* ---------- events ---------- */
document.getElementById("prevDay").onclick=()=>shiftDay(-1);
document.getElementById("nextDay").onclick=()=>shiftDay(1);
document.getElementById("dateBtn").onclick=openCalendar;
document.getElementById("calPrev").onclick=()=>changeCalMonth(-1);
document.getElementById("calNext").onclick=()=>changeCalMonth(1);
document.getElementById("calToday").onclick=()=>{ cursor=todayStr(); closeCalendar(); render(); };
document.getElementById("calClose").onclick=closeCalendar;
document.getElementById("calBackdrop").onclick=e=>{ if(e.target.id==="calBackdrop") closeCalendar(); };
document.getElementById("addCancel").onclick=closeAdd;
document.getElementById("saveFood").onclick=saveFood;

document.getElementById("fName").addEventListener("input", onNameInput);

document.getElementById("addBackdrop").onclick=e=>{ if(e.target.id==="addBackdrop") closeAdd(); };

document.getElementById("openSettings").onclick=openSettings;

document.getElementById("setBackdrop").onclick=e=>{ if(e.target.id==="setBackdrop"){ applySettings(); e.currentTarget.classList.remove("on"); render(); } };
document.getElementById("exportCsv").onclick=exportCsv;
document.getElementById("openFoods").onclick=openFoods;
document.getElementById("foodsClose").onclick=()=>document.getElementById("foodsBackdrop").classList.remove("on");
document.getElementById("foodsBackdrop").onclick=e=>{ if(e.target.id==="foodsBackdrop") e.currentTarget.classList.remove("on"); };

document.getElementById("photoInput").addEventListener("change", onPhotoPicked);
document.getElementById("photoClose").onclick=closePhotoViewer;
document.getElementById("photoReplace").onclick=()=>{ if(viewerMeal){ pickPhoto(viewerMeal); } };
document.getElementById("photoDelete").onclick=async()=>{
  if(!viewerMeal) return;
  const mk=viewerMeal;
  try{ await photoDel(photoKey(mk)); }catch(e){}
  loadMealPhoto(mk); closePhotoViewer(); toast("사진을 삭제했어요");
};
document.getElementById("photoBackdrop").onclick=e=>{ if(e.target.id==="photoBackdrop") closePhotoViewer(); };

document.getElementById("shareDay").onclick=shareDay;
document.getElementById("backupExport").onclick=exportBackup;
document.getElementById("backupImport").onclick=pickBackup;
document.getElementById("backupInput").addEventListener("change", onBackupPicked);

render();
<\/script>
