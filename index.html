<script>
/* ============ storage ============ */
const STORE_KEY="dailyLog.v1";
const DIET_KEY="dietTracker.v1";
const WORKOUT_KEY="workoutTracker.v1";

let db=load();
if(!Array.isArray(db.habits)) db.habits=[];
let cursor=todayStr();
let diaryEditing=false;

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||fresh(); }catch(e){ return fresh(); } }
function fresh(){ return { days:{} }; }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
function readOther(key){ try{ return JSON.parse(localStorage.getItem(key))||null; }catch(e){ return null; } }

function todayStr(){ return fmt(new Date()); }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function shiftDay(n){ const d=parseD(cursor); d.setDate(d.getDate()+n); cursor=fmt(d); render(); }
function round(x){ return Math.round(Number(x)||0); }
function round1(x){ return Math.round((Number(x)||0)*10)/10; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function dayData(date){
  if(!db.days[date]) db.days[date]={ diary:"", todos:[], photos:[] };
  const d=db.days[date];
  if(!Array.isArray(d.todos)) d.todos=[];
  if(!Array.isArray(d.photos)) d.photos=[];
  if(!d.habitDone || typeof d.habitDone!=="object") d.habitDone={};
  return d;
}
// recurring habits active on a given date (date-scoped: shown from addedOn, hidden from removedOn onward)
function activeHabits(date){ return db.habits.filter(h=> h.addedOn<=date && (!h.removedOn || date<h.removedOn)); }

/* ============ IndexedDB (shared, read-only for diet/workout; own store for daily) ============ */
const dbCache={};
function openStore(name){
  return new Promise((res,rej)=>{
    if(dbCache[name]) return res(dbCache[name]);
    const q=indexedDB.open(name,1);
    q.onupgradeneeded=()=>{ try{ if(!q.result.objectStoreNames.contains("photos")) q.result.createObjectStore("photos"); }catch(e){} };
    q.onsuccess=()=>{ dbCache[name]=q.result; res(q.result); };
    q.onerror=()=>rej(q.error);
  });
}
async function idbGet(dbName,id){
  try{
    const d=await openStore(dbName);
    if(!d.objectStoreNames.contains("photos")) return null;
    return await new Promise((res,rej)=>{ const tx=d.transaction("photos","readonly"); const r=tx.objectStore("photos").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  }catch(e){ return null; }
}
async function idbPut(dbName,id,val){ const d=await openStore(dbName); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").put(val,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbDel(dbName,id){ const d=await openStore(dbName); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

/* ============ diet (read-only) ============ */
const MEALS=[{key:"breakfast",name:"아침"},{key:"lunch",name:"점심"},{key:"dinner",name:"저녁"},{key:"snack",name:"간식"}];
function dietDay(date){ const d=readOther(DIET_KEY); return d&&d.days&&d.days[date] ? d.days[date] : null; }
function dietTotals(date){
  const day=dietDay(date); const t={kcal:0,carb:0,protein:0,fat:0}; let count=0;
  if(!day||!day.meals) return {t,count};
  Object.values(day.meals).forEach(list=>(list||[]).forEach(it=>{ t.kcal+=it.kcal||0; t.carb+=it.carb||0; t.protein+=it.protein||0; t.fat+=it.fat||0; count++; }));
  return {t,count};
}
async function renderDiet(){
  const box=document.getElementById("dietBody");
  const {t,count}=dietTotals(cursor);
  const day=dietDay(cursor);
  const hasDiet=readOther(DIET_KEY)!==null;
  if(!hasDiet){ box.innerHTML=`<div class="noneMsg">식단 앱 데이터를 찾을 수 없어요. 같은 브라우저에서 식단 기록 앱을 한 번 열어주세요.</div>`; return; }

/* ============ workout (read-only) ============ */
function workoutDay(date){ const d=readOther(WORKOUT_KEY); return d&&d.days&&d.days[date] ? d.days[date] : null; }
function fmtDur(M){ M=Number(M)||0; if(!M) return ""; let mm=Math.floor(M); let s=Math.round((M-mm)*60); if(s===60){mm++;s=0;} return s?`${mm}분 ${s}초`:`${mm}분`; }
function workoutSummary(date){
  const day=workoutDay(date); const list=(day&&day.workouts)||[];
  if(!list.length) return "";
  let sc=0,cc=0,cm=0,sm=0,kc=0; const others={};
  list.forEach(w=>{ const mn=Number(w.minutes)||0;
    if(w.type==="cardio"){ cc++; cm+=mn; kc+=Number(w.kcal)||0; }
    else if(w.type==="other"){ const k=w.name||"기타"; others[k]=(others[k]||0)+mn; }
    else { sc++; sm+=mn; } });
  const parts=[];
  if(sc) parts.push(sm?`근력 ${fmtDur(sm)}`:`근력 ${sc}종`);
  if(cc) parts.push(cm?`유산소 ${fmtDur(cm)}`:`유산소 ${cc}종`);
  Object.keys(others).forEach(k=>parts.push(others[k]?`${k} ${fmtDur(others[k])}`:k));
  let t=parts.join(" · ");
  if(kc) t+=` · ${kc}kcal`;
  return t;
}

function workoutDetail(w){
  if(w.type==="cardio"){ const p=[]; if(w.minutes)p.push(fmtDur(w.minutes)); if(w.distance)p.push(w.distance+"km"); if(w.kcal)p.push(w.kcal+"kcal"); return p.join(" · "); }
  if(w.type==="other"){ return w.minutes?fmtDur(w.minutes):""; }
  const p=[]; if(w.weight)p.push(w.weight+"kg"); if(w.reps)p.push(w.reps+"회"); if(w.sets)p.push(w.sets+"세트"); return p.join(" · ");
}

function fileToDataUrl(file,maxSide=900,quality=0.6){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);

    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    try{ res(cv.toDataURL("image/jpeg",quality)); }catch(e){ rej(e); } };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; img.src=url; }); }

/* ============ CSV export (식단·운동·데일리 통합, 날짜별 1줄) ============ */
function dietTotalsFor(date, ddb){
  const t={kcal:0,carb:0,protein:0,fat:0};
  const day = ddb && ddb.days && ddb.days[date];
  if(!day || !day.meals) return t;
  Object.values(day.meals).forEach(list => (list||[]).forEach(it => {
    t.kcal+=it.kcal||0; t.carb+=it.carb||0; t.protein+=it.protein||0; t.fat+=it.fat||0;
  }));
  return t;
}
function fmtDurMin(M){ M=Number(M)||0; if(!M) return ""; let mm=Math.floor(M); let s=Math.round((M-mm)*60); if(s===60){mm++;s=0;} return s?(mm+"분 "+s+"초"):(mm+"분"); }
function workoutSummaryFor(date, wdb){
  const day = wdb && wdb.days && wdb.days[date];
  const list = (day && day.workouts) || [];
  if(!list.length) return "";
  let sc=0,cc=0,cm=0,sm=0,kc=0; const others={};
  list.forEach(w => { const mn=Number(w.minutes)||0;
    if(w.type==="cardio"){ cc++; cm+=mn; kc+=Number(w.kcal)||0; }
    else if(w.type==="other"){ const k=w.name||"기타"; others[k]=(others[k]||0)+mn; }
    else { sc++; sm+=mn; } });
  const parts=[];
  if(sc) parts.push(sm ? ("근력 "+fmtDurMin(sm)) : ("근력 "+sc+"종"));
  if(cc) parts.push(cm ? ("유산소 "+fmtDurMin(cm)) : ("유산소 "+cc+"종"));
  Object.keys(others).forEach(k => parts.push(others[k] ? (k+" "+fmtDurMin(others[k])) : k));
  let t = parts.join(" · ");
  if(kc) t += " · "+kc+"kcal";
  return t;
}
function exportDailyCsv(){
  const ddb = readOther(DIET_KEY);
  const wdb = readOther(WORKOUT_KEY);
  const habits = db.habits || [];
  // 대상 날짜 = 데일리 + 식단 + 운동에 기록이 있는 모든 날
  const dateset = {};
  Object.keys(db.days || {}).forEach(d => { dateset[d] = 1; });
  if (ddb && ddb.days) Object.keys(ddb.days).forEach(d => { dateset[d] = 1; });
  if (wdb && wdb.days) Object.keys(wdb.days).forEach(d => { dateset[d] = 1; });
  const dates = Object.keys(dateset).sort();
  if (!dates.length){ toast("내보낼 기록이 없어요"); return; }

  const header = ["날짜","칼로리(kcal)","탄수화물(g)","단백질(g)","지방(g)","운동요약","체중(kg)","허리둘레(cm)"]
    .concat(habits.map(h => h.name))
    .concat(["일기"]);
  const rows = [header];
  dates.forEach(date => {
    const own = db.days[date] || {};
    const done = own.habitDone || {};
    const body = (wdb && wdb.days && wdb.days[date] && wdb.days[date].body) || {};
    const dt = dietTotalsFor(date, ddb);
    const hasDiet = !!(ddb && ddb.days && ddb.days[date]);
    const row = [
      date,
      hasDiet ? round(dt.kcal) : "",
      hasDiet ? round1(dt.carb) : "",
      hasDiet ? round1(dt.protein) : "",
      hasDiet ? round1(dt.fat) : "",
      workoutSummaryFor(date, wdb),
      (body.weight != null && body.weight !== "") ? body.weight : "",
      (body.waist != null && body.waist !== "") ? body.waist : "",
    ];
    habits.forEach(h => {
      const active = h.addedOn <= date && (!h.removedOn || date < h.removedOn);
      row.push(active ? (done[h.id] ? "O" : "X") : ""); // 활성 아닌 날은 공란
    });
    row.push(own.diary || "");
    rows.push(row);
  });

  const csv = rows.map(r => r.map(c => {
    const v = String(c);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(",")).join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "데일리기록_" + todayStr() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSV를 내려받았어요");
}

<div class="wrap">
  <div class="datebar">
    <button class="nav" id="prevDay">‹</button>

      <div class="d"><span id="dLabel">오늘</span> <span class="caret">▾</span></div>

  </div>

  <div class="card">
    <div class="ctitle">📅 오늘 일정 <button class="refresh" id="calRefresh">새로고침</button></div>
    <div id="schedule"></div>
  </div>

  <div id="diaryBox"></div>
</div>

<!-- Calendar modal -->
<div class="backdrop" id="calBackdrop">
  <div class="sheet">
    <div class="calhead">
      <button class="nav" id="calPrev">‹</button>
      <div class="caltitle" id="calTitle"></div>
      <button class="nav" id="calNext">›</button>
    </div>
    <div class="calgrid caldow" id="calDow"></div>
    <div class="calgrid" id="calDays"></div>
    <div class="actions">
      <button class="btn ghost" id="calToday">오늘로</button>
      <button class="btn primary" id="calClose">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY="dailyLog.v1";
const CAL_PROXY="https://solar.slutica.workers.dev";
let db=load();
let cursor=todayStr();
let diaryEditing=false;
let calMonth=null;
const evCache={}; // date -> events (그날 캐시)

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||fresh(); }catch(e){ return fresh(); } }
function fresh(){ return { days:{} }; }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
function todayStr(){ return fmt(new Date()); }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function shiftDay(n){ const d=parseD(cursor); d.setDate(d.getDate()+n); cursor=fmt(d); render(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function dayData(date){ if(!db.days[date]) db.days[date]={ diary:"", todos:[], photos:[] }; return db.days[date]; }

/* ---------- schedule (구글 캘린더) ---------- */
async function loadSchedule(force){
  const box=document.getElementById("schedule");
  const date=cursor;
  if(!force && evCache[date]){ renderSchedule(evCache[date]); return; }
  box.innerHTML='<div class="schmsg">일정 불러오는 중…</div>';
  try{
    const r=await fetch(CAL_PROXY,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action:"calendar", date:date}) });
    const d=await r.json();
    if(d.error){
      if(d.error==="no calendar url") box.innerHTML='<div class="schmsg">캘린더가 아직 연결되지 않았어요. (Worker에 GCAL_ICS_URL 설정 필요)</div>';
      else box.innerHTML='<div class="schmsg">일정을 불러오지 못했어요: '+esc(d.error)+'</div>';
      return;
    }
    const evs=d.events||[];
    if(date===cursor){ evCache[date]=evs; renderSchedule(evs); }
  }catch(e){
    box.innerHTML='<div class="schmsg">네트워크 오류로 일정을 못 불러왔어요.</div>';
  }
}
function renderSchedule(evs){
  const box=document.getElementById("schedule");
  if(!evs.length){ box.innerHTML='<div class="schmsg">이 날 일정이 없어요.</div>'; return; }
  box.innerHTML=evs.map(e=>`<div class="ev"><div class="t${e.allDay?" allday":""}">${e.allDay?"종일":esc(e.time||"")}</div><div class="nm">${esc(e.title||"")}</div></div>`).join("");
}

/* ---------- diary ---------- */
function renderDiary(){
  const box=document.getElementById("diaryBox");
  const text=dayData(cursor).diary||"";
  if(diaryEditing){
    box.innerHTML=`<div class="card diary">
      <div class="ctitle">📔 오늘의 일기</div>
      <textarea id="diaryInput" placeholder="오늘 하루 어땠나요? 있었던 일, 생각, 느낀 점을 자유롭게 적어보세요."></textarea>
      <div class="diary-actions"><button class="cancel" id="diaryCancel">취소</button><button class="save" id="diarySave">저장</button></div>
    </div>`;
    const ta=document.getElementById("diaryInput"); ta.value=text;
    document.getElementById("diaryCancel").onclick=()=>{ diaryEditing=false; renderDiary(); };
    document.getElementById("diarySave").onclick=()=>{
      const v=ta.value.trim();
      if(v) dayData(cursor).diary=v; else delete dayData(cursor).diary;
      save(); diaryEditing=false; renderDiary(); toast(v?"일기를 저장했어요":"일기를 비웠어요");
    };
    setTimeout(()=>ta.focus(),50);
  } else if(text){
    box.innerHTML=`<div class="card diary">
      <div class="diary-head"><span class="ctitle" style="margin:0">📔 오늘의 일기</span>
        <span class="diary-btns"><button id="diaryEdit">수정</button><button class="del" id="diaryDelete">삭제</button></span></div>
      <div class="diary-text">${esc(text)}</div>
    </div>`;
    document.getElementById("diaryEdit").onclick=()=>{ diaryEditing=true; renderDiary(); };
    document.getElementById("diaryDelete").onclick=()=>{ if(!confirm("이 날의 일기를 삭제할까요?")) return; delete dayData(cursor).diary; save(); renderDiary(); toast("일기를 삭제했어요"); };
  } else {
    box.innerHTML=`<button class="diary-write" id="diaryWrite">＋ 오늘의 일기 쓰기</button>`;
    document.getElementById("diaryWrite").onclick=()=>{ diaryEditing=true; renderDiary(); };
  }
}

/* ---------- calendar modal ---------- */
function dayHasDiary(ds){ const d=db.days[ds]; return !!d && d.diary && d.diary.trim(); }
function openCalendar(){ const d=parseD(cursor); calMonth=new Date(d.getFullYear(),d.getMonth(),1); renderCalendar(); document.getElementById("calBackdrop").classList.add("on"); }
function closeCalendar(){ document.getElementById("calBackdrop").classList.remove("on"); }
function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  document.getElementById("calTitle").textContent=`${y}년 ${m+1}월`;
  document.getElementById("calDow").innerHTML=["일","월","화","수","목","금","토"].map((w,i)=>`<span style="${i===0?'color:#d64545':(i===6?'color:#2f6bbd':'')}">${w}</span>`).join("");
  const days=document.getElementById("calDays"); days.innerHTML="";
  const startDow=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
  for(let i=0;i<startDow;i++){ const c=document.createElement("div"); c.className="calcell empty"; days.appendChild(c); }
  for(let dd=1;dd<=n;dd++){ const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
    const c=document.createElement("div"); c.className="calcell";
    if(ds===cursor) c.classList.add("sel"); else if(ds===todayStr()) c.classList.add("today");
    c.innerHTML=`<span>${dd}</span>`+(dayHasDiary(ds)?`<span class="dot"></span>`:"");
    c.onclick=()=>{ cursor=ds; closeCalendar(); render(); };
    days.appendChild(c);
  }
}

/* ---------- render ---------- */
function render(){
  const d=parseD(cursor); const wk=["일","월","화","수","목","금","토"][d.getDay()];
  document.getElementById("dLabel").textContent = cursor===todayStr()?"오늘":`${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById("dSub").textContent = `${cursor} (${wk})`;
  diaryEditing=false; renderDiary();
  loadSchedule(false);
}

document.getElementById("prevDay").onclick=()=>shiftDay(-1);
document.getElementById("nextDay").onclick=()=>shiftDay(1);
document.getElementById("dateBtn").onclick=openCalendar;
document.getElementById("calRefresh").onclick=()=>loadSchedule(true);
document.getElementById("calPrev").onclick=()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); };
document.getElementById("calNext").onclick=()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); };
document.getElementById("calToday").onclick=()=>{ cursor=todayStr(); closeCalendar(); render(); };
document.getElementById("calClose").onclick=closeCalendar;
document.getElementById("calBackdrop").addEventListener("click",e=>{ if(e.target.id==="calBackdrop") closeCalendar(); });

let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),1600); }

render();
<\/script>
</body>
</html>
</script>

<script>
const MEALS = [
  {key:"breakfast", emo:"🌅", name:"아침"},
  {key:"lunch",     emo:"🍱", name:"점심"},
  {key:"dinner",    emo:"🌙", name:"저녁"},
  {key:"snack",     emo:"🍪", name:"간식"},
];
const STORE_KEY = "dietTracker.v1";
const SOLAR_PROXY = "https://solar.slutica.workers.dev"; // Cloudflare Worker (Solar 영양성분 자동 채우기)

let db = load();
if(!db.custom) db.custom={};   // migrate older saved data
if(!db.settings) db.settings=fresh().settings;
if(!db.settings.guides){       // migrate single guide -> date-scoped history
  db.settings.guides={};
  if(db.settings.guide) db.settings.guides["1970-01-01"]=db.settings.guide;
}
let cursor = todayStr();
let activeMeal = null;
let pendingItems = [];   // items awaiting confirm

function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || fresh(); }
  catch(e){ return fresh(); }
}
function fresh(){
  return { days:{}, custom:{}, settings:{ kcalGoalEnabled:true, dailyGoalKcal:2000, proteinGoalEnabled:true, dailyGoalProtein:100 } };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }

// saved-value memory: normalize a food/product name so spacing & case differences still match
function normKey(name){ return String(name||"").trim().toLowerCase().replace(/\s+/g,""); }
function applySaved(it){
  const k=normKey(it.name);
  let c=db.custom[k];
  if(!c){ for(const kk in db.custom){ if(normKey(db.custom[kk].name)===k){ c=db.custom[kk]; break; } } }
  if(!c) return it;
  it.quantity=c.quantity; it.unit=c.unit;
  it.kcal=c.kcal; it.carb=c.carb; it.protein=c.protein; it.fat=c.fat;
  it.base={ q:c.quantity, kcal:c.kcal, carb:c.carb, protein:c.protein, fat:c.fat };
  it.source="user_manual"; it.isProduct=false; it.saved=true;
  return it;
}
function rememberItem(it){
  const b=it.base||{ q:it.quantity, kcal:it.kcal, carb:it.carb, protein:it.protein, fat:it.fat };
  db.custom[normKey(it.name)] = {
    name:it.name, quantity:b.q, unit:it.unit,
    kcal:round1(b.kcal), carb:round1(b.carb), protein:round1(b.protein), fat:round1(b.fat)
  };
}

function todayStr(){ const d=new Date(); return fmt(d); }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function shiftDay(n){ const d=parseD(cursor); d.setDate(d.getDate()+n); cursor=fmt(d); render(); }

function dayData(date){
  if(!db.days[date]) db.days[date]={ meals:{breakfast:[],lunch:[],dinner:[],snack:[]} };
  const m=db.days[date].meals;
  ["breakfast","lunch","dinner","snack"].forEach(k=>{ if(!m[k]) m[k]=[]; });
  return db.days[date];
}
function round(x){ return Math.round((Number(x)||0)); }
function round1(x){ return Math.round((Number(x)||0)*10)/10; }

function dayTotals(date){
  const d=dayData(date); let t={kcal:0,carb:0,protein:0,fat:0};
  Object.values(d.meals).forEach(list=>list.forEach(it=>{
    t.kcal+=it.kcal; t.carb+=it.carb; t.protein+=it.protein; t.fat+=it.fat;
  }));
  return t;
}

/* ---------- rendering ---------- */
/* ---------- calendar ---------- */
let calMonth=null;
function dayHasData(ds){ const day=db.days[ds]; return !!day && ["breakfast","lunch","dinner","snack"].some(k=>(day.meals[k]||[]).length>0); }
function openCalendar(){ const d=parseD(cursor); calMonth=new Date(d.getFullYear(),d.getMonth(),1); renderCalendar(); document.getElementById("calBackdrop").classList.add("on"); }
function closeCalendar(){ document.getElementById("calBackdrop").classList.remove("on"); }
function changeCalMonth(delta){ calMonth.setMonth(calMonth.getMonth()+delta); renderCalendar(); }
function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  document.getElementById("calTitle").textContent=`${y}년 ${m+1}월`;
  document.getElementById("calDow").innerHTML=["일","월","화","수","목","금","토"]
    .map((w,i)=>`<span style="${i===0?'color:#d64545':(i===6?'color:#2f6bbd':'')}">${w}</span>`).join("");
  const days=document.getElementById("calDays"); days.innerHTML="";
  const startDow=new Date(y,m,1).getDay();
  const nDays=new Date(y,m+1,0).getDate();
  for(let i=0;i<startDow;i++){ const c=document.createElement("div"); c.className="calcell empty"; days.appendChild(c); }
  for(let dd=1; dd<=nDays; dd++){
    const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
    const c=document.createElement("div"); c.className="calcell";
    if(ds===cursor) c.classList.add("sel");
    else if(ds===todayStr()) c.classList.add("today");
    c.innerHTML=`<span>${dd}</span>`+(dayHasData(ds)?`<span class="dot"></span>`:"");
    c.onclick=()=>{ cursor=ds; closeCalendar(); render(); };

// guide in effect for a date = the most recent guide set on or before that date
function guideForDate(date){
  const g=db.settings.guides||{}; let bestKey=null;
  for(const k in g){ if(k<=date && (bestKey===null || k>bestKey)) bestKey=k; }
  return bestKey===null ? "" : (g[bestKey]||"");
}

function goalBar(cls,label,cur,goal,unit){
  const pct=goal>0?Math.min(100,Math.round(cur/goal*100)):0;

  div.innerHTML=`<div class="row"><span>${label}</span><span>${cur.toLocaleString()} / ${Number(goal).toLocaleString()}${unit}${over?" ⚠":""}</span></div>
    <div class="bar${over?" over":""}"><i style="width:${pct}%"></i></div>`;
  return div;
}

let selectedFoodGroup=null;
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHO2G={'ㄱ':'가','ㄲ':'가','ㄴ':'나','ㄷ':'다','ㄸ':'다','ㄹ':'라','ㅁ':'마','ㅂ':'바','ㅃ':'바','ㅅ':'사','ㅆ':'사','ㅇ':'아','ㅈ':'자','ㅉ':'자','ㅊ':'차','ㅋ':'카','ㅌ':'타','ㅍ':'파','ㅎ':'하'};
const GORDER=['가','나','다','라','마','바','사','아','자','차','카','타','파','하','#'];
function groupOf(name){
  const ch=(name||"").trim().charAt(0);
  if(!ch) return "#";
  const code=ch.charCodeAt(0);
  if(code>=0xAC00 && code<=0xD7A3) return CHO2G[CHO[Math.floor((code-0xAC00)/588)]]||"#";
  if(CHO2G[ch]) return CHO2G[ch];
  return "#";
}

/* ---------- meal photos (IndexedDB) ---------- */
let _pdb=null, photoTargetMeal=null, viewerMeal=null;
function pdb(){
  return new Promise((resolve,reject)=>{
    if(_pdb) return resolve(_pdb);
    const req=indexedDB.open("dietPhotos",1);
    req.onupgradeneeded=()=>req.result.createObjectStore("photos");
    req.onsuccess=()=>{ _pdb=req.result; resolve(_pdb); };
    req.onerror=()=>reject(req.error);
  });
}
async function photoPut(id,dataUrl){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").put(dataUrl,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function photoGet(id){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readonly"); const r=tx.objectStore("photos").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function photoDel(id){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function photoAll(){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readonly"); const out={}; const r=tx.objectStore("photos").openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); }); }
async function photoClearAll(){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos","readwrite"); tx.objectStore("photos").clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function photoKey(mk){ return cursor+"__"+mk; }

// downscale + compress so photos stay small
function fileToDataUrl(file, maxSide=720, quality=0.5){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(Math.max(w,h)>maxSide){ const r=maxSide/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{ resolve(cv.toDataURL("image/jpeg",quality)); }catch(e){ reject(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("img load")); };
    img.src=url;
  });
}

/* ---------- share day as image card ---------- */
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function F(sz,w){ return (w||"400")+" "+sz+"px -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"; }
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function ellipsize(ctx,text,maxW,font){ ctx.font=font; if(ctx.measureText(text).width<=maxW) return text; let s=text; while(s.length>1 && ctx.measureText(s+"…").width>maxW) s=s.slice(0,-1); return s+"…"; }
function drawCover(ctx,img,x,y,w,h,r){
  ctx.save(); rrect(ctx,x,y,w,h,r); ctx.clip();
  const ir=img.width/img.height, tr=w/h; let sw,sh,sx,sy;
  if(ir>tr){ sh=img.height; sw=sh*tr; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/tr; sx=0; sy=(img.height-sh)/2; }
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h); ctx.restore();
}
function wrapLines(ctx,text,font,firstW,restW){
  ctx.font=font;
  const lines=[]; let cur="", maxW=firstW;
  for(const ch of text){
    const test=cur+ch;
    if(cur!=="" && ctx.measureText(test).width>maxW){ lines.push(cur); cur=ch; maxW=restW; }
    else cur=test;
  }
  if(cur!=="") lines.push(cur);
  return lines.length?lines:[""];
}
async function generateShareCard(){
  const S=2, LW=420, M=16, CP=20;
  const NAMEH=16, MACROH=15, FOODGAP=7, MEALHEADH=22, MEALGAP=10, IND=6, KCALW=66;
  const cardX=M, innerX=cardX+CP, cardW=LW-2*M, innerW=cardW-2*CP, innerR=innerX+innerW;
  const t=dayTotals(cursor);
  const d=parseD(cursor), wk=["일","월","화","수","목","금","토"][d.getDay()];
  const dateLabel=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} (${wk})`;
  const meals=MEALS.map(m=>{ const list=dayData(cursor).meals[m.key]; return {m,list,sub:list.reduce((a,it)=>a+it.kcal,0)}; });
  const mealsWith=meals.filter(x=>x.list.length>0);
  const photos=[];
  for(const m of MEALS){ let du=null; try{ du=await photoGet(photoKey(m.key)); }catch(e){} if(du){ try{ photos.push({m,img:await loadImg(du)}); }catch(e){} } }

  const cv=document.createElement("canvas");
  const ctx=cv.getContext("2d");
  cv.width=LW*S; cv.height=10; ctx.scale(S,S);   // temp size just for measuring

  // per-meal: totals + per-food rows (food name may wrap)
  const mealRender=mealsWith.map(ml=>{
    let carb=0,protein=0,fat=0;
    ml.list.forEach(it=>{ carb+=it.carb; protein+=it.protein; fat+=it.fat; });
    const foods=ml.list.map(it=>({
      name:it.name, kcal:round(it.kcal), carb:round1(it.carb), protein:round1(it.protein), fat:round1(it.fat),
      nameLines:wrapLines(ctx, it.name, F(13), innerW-IND, innerW-IND)
    }));
    return { m:ml.m, sub:round(ml.sub), carb:round(carb), protein:round(protein), fat:round(fat), foods };
  });

  // height
  let h=M+CP+46+14+46;
  if(photos.length) h+=16+84+18;
  h+=14+1+12;
  if(mealRender.length){
    mealRender.forEach(mr=>{ h+=MEALHEADH; mr.foods.forEach(fd=>{ h+=fd.nameLines.length*NAMEH+MACROH+FOODGAP; }); h+=MEALGAP; });
  } else h+=24;
  h+=CP+M;
  const LH=h;

  cv.height=LH*S; ctx.setTransform(1,0,0,1,0,0); ctx.scale(S,S); ctx.textBaseline="alphabetic";

  ctx.fillStyle="#eef0f3"; ctx.fillRect(0,0,LW,LH);
  rrect(ctx,cardX,M,cardW,LH-2*M,16); ctx.fillStyle="#ffffff"; ctx.fill();
  ctx.strokeStyle="#e8ebf0"; ctx.lineWidth=1; ctx.stroke();

  let y=M+CP;
  // header
  ctx.textAlign="left"; ctx.fillStyle="#8a8f98"; ctx.font=F(13); ctx.fillText("식단 기록", innerX, y+13);
  ctx.fillStyle="#1c1e21"; ctx.font=F(18,"600"); ctx.fillText(dateLabel, innerX, y+36);
  ctx.textAlign="right"; ctx.fillStyle="#1c1e21"; ctx.font=F(30,"700"); ctx.fillText(round(t.kcal).toLocaleString(), innerR, y+30);
  ctx.font=F(12); ctx.fillStyle="#8a8f98"; ctx.fillText("kcal", innerR, y+44);
  ctx.textAlign="left";
  y+=46+14;
  // macros
  const chips=[["탄수화물",round(t.carb),"#FBF1E0","#B9791F"],["단백질",round(t.protein),"#FCEAEC","#C0455E"],["지방",round(t.fat),"#E9F1FB","#2F6BBD"]];
  const cw=(innerW-16)/3;
  chips.forEach((c,i)=>{ const x=innerX+i*(cw+8); rrect(ctx,x,y,cw,46,8); ctx.fillStyle=c[2]; ctx.fill();
    ctx.textAlign="center"; ctx.fillStyle=c[3]; ctx.font=F(15,"700"); ctx.fillText(c[1]+"g", x+cw/2, y+21);
    ctx.font=F(11); ctx.fillText(c[0], x+cw/2, y+37); });
  ctx.textAlign="left";
  y+=46;
  // photos
  if(photos.length){
    y+=16; const n=photos.length, pw=(innerW-(n-1)*8)/n, ph=84;
    photos.forEach((p,i)=>{ const x=innerX+i*(pw+8); drawCover(ctx,p.img,x,y,pw,ph,8);
      ctx.textAlign="center"; ctx.fillStyle="#8a8f98"; ctx.font=F(11); ctx.fillText(p.m.emo+" "+p.m.name, x+pw/2, y+ph+14); });
    ctx.textAlign="left"; y+=84+18;
  }
  y+=14;
  ctx.strokeStyle="#f0f2f5"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(innerX,y); ctx.lineTo(innerR,y); ctx.stroke();
  y+=1+12;
  // per-meal breakdown
  if(mealRender.length){
    mealRender.forEach(mr=>{
      // meal header: name + macros summary (darker)
      ctx.textAlign="left"; ctx.fillStyle="#1c1e21"; ctx.font=F(14,"600"); ctx.fillText(`${mr.m.emo} ${mr.m.name}`, innerX, y+14);
      ctx.textAlign="right"; ctx.fillStyle="#565b63"; ctx.font=F(12); ctx.fillText(`${mr.sub} kcal · 탄 ${mr.carb} · 단 ${mr.protein} · 지 ${mr.fat}`, innerR, y+14);
      ctx.textAlign="left"; y+=MEALHEADH;
      // foods: name line, then "kcal · 탄 · 단 · 지" on one muted line
      mr.foods.forEach(fd=>{
        ctx.textAlign="left"; ctx.fillStyle="#1c1e21"; ctx.font=F(13);
        fd.nameLines.forEach((ln,i)=>ctx.fillText(ln, innerX+IND, y+13+i*NAMEH));
        const yy=y+fd.nameLines.length*NAMEH;
        ctx.fillStyle="#a3a8af"; ctx.font=F(11); ctx.fillText(`${fd.kcal} kcal · 탄 ${fd.carb} · 단 ${fd.protein} · 지 ${fd.fat} (g)`, innerX+IND, yy+11);
        y=yy+MACROH+FOODGAP;
      });
      y+=MEALGAP;
    });
  } else {
    ctx.textAlign="center"; ctx.fillStyle="#b3b8bf"; ctx.font=F(14); ctx.fillText("이 날은 기록이 없어요", innerX+innerW/2, y+14); ctx.textAlign="left"; y+=24;
  }
  return await new Promise(res=>cv.toBlob(res,"image/png",0.92));
}
async function shareDay(){
  try{
    toast("이미지 만드는 중…");
    const blob=await generateShareCard();
    const file=new File([blob], `식단_${cursor}.png`, {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:"식단 기록", text:`${cursor} 식단 기록` });
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast("이미지를 저장했어요");
    }
  }catch(e){ console.error(e); toast("공유에 실패했어요"); }
}

/* ---------- backup / restore (for iCloud Drive sync) ---------- */
async function exportBackup(){
  toast("백업 파일 만드는 중…");
  let photos={}; try{ photos=await photoAll(); }catch(e){}
  const payload={ app:"diet-tracker", version:1, exportedAt:new Date().toISOString(), data:db, photos };
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const fname=`식단백업_${todayStr()}.json`;
  const file=new File([blob], fname, {type:"application/json"});
  // prefer the iOS share sheet -> "파일에 저장" -> iCloud Drive
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({ files:[file], title:"식단 백업" }); toast("공유 시트 → '파일에 저장' → iCloud Drive"); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  // fallback: plain download
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("백업 내보냄 · '기타…' → 파일에 저장 → iCloud Drive");
}
function pickBackup(){ const inp=document.getElementById("backupInput"); inp.value=""; inp.click(); }
async function onBackupPicked(){
  const inp=document.getElementById("backupInput");
  const f=inp.files && inp.files[0]; if(!f) return;
  try{
    const obj=JSON.parse(await f.text());
    if(!obj || obj.app!=="diet-tracker" || !obj.data){ toast("올바른 백업 파일이 아니에요"); return; }
    const when=obj.exportedAt? new Date(obj.exportedAt).toLocaleString("ko-KR") : "알 수 없음";
    if(!confirm(`이 백업으로 현재 기기의 기록을 덮어씁니다.\n\n백업 시점: ${when}\n\n계속할까요?`)) return;
    db=obj.data;
    if(!db.custom) db.custom={};
    if(!db.settings) db.settings=fresh().settings;
    if(!db.days) db.days={};
    save();
    try{
      await photoClearAll();
      if(obj.photos){ for(const k in obj.photos){ await photoPut(k, obj.photos[k]); } }
    }catch(e){ console.error("photo restore", e); }
    document.getElementById("setBackdrop").classList.remove("on");
    render();
    toast("복원했어요");
  }catch(e){ console.error(e); toast("가져오기에 실패했어요"); }
}

/* ---------- CSV ---------- */
function exportCsv(){
  const rows=[["날짜","끼니","음식명","수량","단위","칼로리","탄수화물","단백질","지방","출처"]];
  const srcTxt={ai_estimate:"AI추정",product_confirmed:"제품확인",user_manual:"직접입력"};
  const mealTxt={breakfast:"아침",lunch:"점심",dinner:"저녁",snack:"간식"};
  Object.keys(db.days).sort().forEach(date=>{
    ["breakfast","lunch","dinner","snack"].forEach(mk=>{
      (db.days[date].meals[mk]||[]).forEach(it=>{
        rows.push([date,mealTxt[mk],it.name,it.quantity,it.unit,round(it.kcal),round1(it.carb),round1(it.protein),round1(it.fat),srcTxt[it.source]||it.source]);
      });
    });
  });
  if(rows.length===1){ toast("내보낼 기록이 없어요"); return; }
  const csv=rows.map(r=>r.map(c=>{ const v=String(c); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(",")).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`식단기록_${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(url); toast("CSV를 내려받았어요");
}

}

<script>
const STORE_KEY="workoutTracker.v1";
let db=load();
if(!db.custom) db.custom={};
if(!db.settings) db.settings={};
if(!db.importedIds) db.importedIds={};
let currentView="day";
let cursor=todayStr();
let calMonth=null, selType="strength", diaryEditing=false, editingIndex=null;

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||fresh(); }catch(e){ return fresh(); } }
function fresh(){ return { days:{}, custom:{}, settings:{}, importedIds:{} }; }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }

function todayStr(){ return fmt(new Date()); }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function shiftDay(n){ const d=parseD(cursor); d.setDate(d.getDate()+n); cursor=fmt(d); renderView(); }
function round(x){ return Math.round(Number(x)||0); }
function round1(x){ return Math.round((Number(x)||0)*10)/10; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function normKey(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g,""); }

function dayData(date){
  if(!db.days[date]) db.days[date]={ workouts:[], diary:"", photos:[] };
  const d=db.days[date];
  if(!Array.isArray(d.workouts)) d.workouts=[];
  if(!Array.isArray(d.photos)) d.photos=[];
  return d;
}
function summarize(date){
  const list=(db.days[date]&&db.days[date].workouts)||[];
  let sc=0, cc=0, oc=0, cm=0, sm=0, om=0, kc=0;
  list.forEach(w=>{ const mn=Number(w.minutes)||0;
    if(w.type==="cardio"){ cc++; cm+=mn; kc+=Number(w.kcal)||0; }
    else if(w.type==="other"){ oc++; om+=mn; }
    else { sc++; sm+=mn; } });
  return { count:list.length, sc, cc, oc, cm, sm, om, kc };
}
function workoutParts(date){
  const list=(db.days[date]&&db.days[date].workouts)||[];
  const s=summarize(date); const parts=[];
  if(s.sc) parts.push(s.sm? `근력 ${fmtDur(s.sm)}` : `근력 ${s.sc}`);
  if(s.cc) parts.push(s.cm? `유산소 ${fmtDur(s.cm)}` : `유산소 ${s.cc}`);
  const others={};
  list.filter(w=>w.type==="other").forEach(w=>{ const k=(w.name||"기타"); others[k]=(others[k]||0)+(Number(w.minutes)||0); });
  Object.keys(others).forEach(k=>{ parts.push(others[k]? `${k} ${fmtDur(others[k])}` : k); });
  return parts;
}
function summaryText(date){
  const list=(db.days[date]&&db.days[date].workouts)||[];
  if(!list.length) return "기록 없음";
  const parts=workoutParts(date); const s=summarize(date);
  let t=parts.join(" · ");
  if(s.kc) t+=` · ${s.kc}kcal`;
  return t;
}
function dayWeight(date){ const d=db.days[date]; return d&&d.body&&d.body.weight!==""&&d.body.weight!=null ? d.body.weight : null; }
function dayHasData(date){ const d=db.days[date]; return !!d && (((d.workouts||[]).length>0)||(d.diary&&d.diary.trim())||((d.photos||[]).length>0)); }
// time entered as "분.초" (45분 17초 -> "45.17"); stored internally as decimal minutes
function mmssToMin(v){ v=String(v).trim(); if(!v) return 0; if(v.indexOf(".")<0) return parseInt(v)||0;
  const parts=v.split("."); const mm=parseInt(parts[0])||0; let s=(String(parts[1]||"")+"00").slice(0,2); let secs=parseInt(s)||0; if(secs>59) secs=59; return mm+secs/60; }
function minToMMSS(M){ M=Number(M)||0; let mm=Math.floor(M); let secs=Math.round((M-mm)*60); if(secs===60){mm++;secs=0;} return secs?(mm+"."+String(secs).padStart(2,"0")):String(mm); }
function fmtDur(M){ M=Number(M)||0; if(!M) return ""; let mm=Math.floor(M); let secs=Math.round((M-mm)*60); if(secs===60){mm++;secs=0;} return secs?`${mm}분 ${secs}초`:`${mm}분`; }
function wIcon(t){ return t==="cardio"?"🏃":(t==="other"?"🧘":"🏋️"); }
function workoutDetail(w){
  if(w.type==="cardio"){ const p=[]; if(w.minutes)p.push("시간 "+fmtDur(w.minutes)); if(w.distance)p.push("거리 "+w.distance+"km"); if(w.pace)p.push("페이스 "+w.pace+"/km"); if(w.hr)p.push("평균심박 "+w.hr); if(w.kcal)p.push("칼로리 "+w.kcal+"kcal"); return p.join(" · ")||"기록"; }
  if(w.type==="other"){ return w.minutes? ("시간 "+fmtDur(w.minutes)) : "기록"; }
  const p=[]; if(w.weight)p.push("무게 "+w.weight+"kg"); if(w.reps)p.push("횟수 "+w.reps+"회"); if(w.sets)p.push("세트 "+w.sets); if(w.minutes)p.push("시간 "+fmtDur(w.minutes)); return p.join(" · ")||"기록";
}

/* ---------- view routing ---------- */
function renderView(){
  document.querySelectorAll(".vtoggle button").forEach(b=>b.classList.toggle("on", b.dataset.view===currentView));
  if(currentView==="day") renderDay();
  else if(currentView==="week") renderWeek();
  else renderMonth();
}
function navBar(midHtml){
  return `<div class="navbar">
    <button class="nav" id="navPrev">‹</button>
    <div class="mid" id="navMid">${midHtml}</div>
    <button class="nav" id="navNext">›</button>
    <button class="gear" id="openSettings">⚙</button>
  </div>`;
}

/* ---------- DAY view ---------- */
function renderDay(){
  const d=parseD(cursor), wk=["일","월","화","수","목","금","토"][d.getDay()];
  const dlabel = cursor===todayStr()? "오늘" : `${d.getMonth()+1}월 ${d.getDate()}일`;
  const data=dayData(cursor);
  const workoutsHtml = data.workouts.length
    ? data.workouts.map((w,i)=>`<div class="item">
        <div class="info" data-i="${i}" style="cursor:pointer"><div class="nm">${wIcon(w.type)} ${esc(w.name)}</div><div class="dt">${esc(workoutDetail(w))} <span style="color:#c4c8ce">›</span></div></div>
        <button class="del" data-i="${i}">×</button></div>`).join("")
    : `<div class="empty">아직 운동 기록이 없어요</div>`;

  const html = navBar(`<div class="d">${dlabel} <span class="caret">▾</span></div><div class="sub">${cursor} (${wk})</div>`)
    + `<div class="summary"><button class="sharebtn" id="shareDay">⤴ 공유</button>
        <div class="big">${cursor===todayStr()?"오늘":dlabel} 운동</div>
        <div class="sub">${summaryText(cursor)}</div></div>`
    + `<div class="wcard"><header><span class="ttl">운동</span></header><div class="items">${workoutsHtml}</div></div>`
    + `<button class="addbtn" id="addWorkout">+ 운동 추가</button>`
    + `<div class="photos"><div class="ph-title">📷 운동 사진</div><div class="ph-row" id="phRow"></div></div>`
    + `<div class="bodycard"><div class="ph-title">📏 몸 상태</div>
        <div class="bc-row">
          <div class="bc-f"><input type="number" id="bodyWeight" inputmode="decimal" step="0.1" placeholder="-"><div class="bc-l">체중 (kg)</div></div>
          <div class="bc-f"><input type="number" id="bodyWaist" inputmode="decimal" step="0.1" placeholder="-"><div class="bc-l">허리둘레 (cm)</div></div>
        </div></div>`
    + `<div id="diaryBox"></div>`
    + `<div class="toolbar"><button class="exportbtn" id="exportCsv">⬇ CSV 내보내기</button></div>`;

  document.getElementById("view").innerHTML=html;

  document.getElementById("navPrev").onclick=()=>shiftDay(-1);
  document.getElementById("navNext").onclick=()=>shiftDay(1);
  document.getElementById("navMid").onclick=openCalendar;
  document.getElementById("openSettings").onclick=openSettings;
  document.getElementById("addWorkout").onclick=openAdd;
  document.getElementById("shareDay").onclick=shareDay;
  document.getElementById("exportCsv").onclick=exportCsv;
  document.querySelectorAll(".wcard .del").forEach(b=>b.onclick=()=>{ data.workouts.splice(Number(b.dataset.i),1); save(); renderDay(); });
  document.querySelectorAll(".wcard .item .info").forEach(el=>el.onclick=()=>openEdit(Number(el.dataset.i)));
  renderPhotoRow();
  // body metrics
  const bd=data.body||{};
  document.getElementById("bodyWeight").value = (bd.weight||bd.weight===0)&&bd.weight!==""?bd.weight:"";
  document.getElementById("bodyWaist").value = (bd.waist||bd.waist===0)&&bd.waist!==""?bd.waist:"";
  document.getElementById("bodyWeight").addEventListener("change", saveBody);
  document.getElementById("bodyWaist").addEventListener("change", saveBody);
  diaryEditing=false; renderDiary();
}
function saveBody(){
  const d=dayData(cursor);
  const w=document.getElementById("bodyWeight").value.trim();
  const t=document.getElementById("bodyWaist").value.trim();
  d.body={ weight: w?round1(w):"", waist: t?round1(t):"" };
  save();
}

/* ---------- WEEK view ---------- */
function weekStart(d){ const x=parseD(fmt(d)); x.setDate(x.getDate()-x.getDay()); return x; } // Sunday start
function renderWeek(){
  const start=weekStart(parseD(cursor));
  const end=new Date(start); end.setDate(end.getDate()+6);
  const range=`${start.getMonth()+1}.${start.getDate()} – ${end.getMonth()+1}.${end.getDate()}`;
  let rows="";
  const wkn=["일","월","화","수","목","금","토"];
  for(let i=0;i<7;i++){
    const dd=new Date(start); dd.setDate(dd.getDate()+i); const ds=fmt(dd);
    const isToday=ds===todayStr();
    const parts=workoutParts(ds); const bw=dayWeight(ds);
    const bits=[]; if(parts.length) bits.push(parts.join(" · ")); if(bw!=null) bits.push(`몸무게 ${bw}kg`);
    const has=bits.length>0;
    const text=has?bits.join(" · "):"기록 없음";
    rows+=`<div class="weekrow${isToday?" today":""}" data-date="${ds}">
      <div class="wl"><div class="dy">${wkn[dd.getDay()]}요일</div><div class="dt">${ds}</div></div>
      <div class="wr${has?"":" none"}">${esc(text)}${has?'<span class="dot"></span>':''}</div>
    </div>`;
  }
  document.getElementById("view").innerHTML = navBar(`<div class="d">${range}</div>`) + rows;
  document.getElementById("navPrev").onclick=()=>{ shiftDayBy(-7); };
  document.getElementById("navNext").onclick=()=>{ shiftDayBy(7); };
  document.getElementById("navMid").onclick=openCalendar;
  document.getElementById("openSettings").onclick=openSettings;
  document.querySelectorAll(".weekrow").forEach(r=>r.onclick=()=>{ cursor=r.dataset.date; currentView="day"; renderView(); });
}
function shiftDayBy(n){ const d=parseD(cursor); d.setDate(d.getDate()+n); cursor=fmt(d); renderView(); }

/* ---------- MONTH view ---------- */

  if(selType==="cardio"){ w.minutes=mmssToMin(document.getElementById("wMin").value); w.distance=round1(document.getElementById("wDist").value); w.kcal=round(document.getElementById("wKcal").value); w.pace=document.getElementById("wPace").value.trim(); w.hr=round(document.getElementById("wHr").value); }

  else { w.weight=round1(document.getElementById("wWeight").value); w.reps=round(document.getElementById("wReps").value); w.sets=round(document.getElementById("wSets").value); w.minutes=mmssToMin(document.getElementById("wStrMin").value); }

/* ---------- photos (IndexedDB) ---------- */
let _pdb=null, viewerId=null;
function pdb(){ return new Promise((res,rej)=>{ if(_pdb) return res(_pdb); const q=indexedDB.open("workoutPhotos",1);
  q.onupgradeneeded=()=>q.result.createObjectStore("photos"); q.onsuccess=()=>{ _pdb=q.result; res(_pdb); }; q.onerror=()=>rej(q.error); }); }
function photoPut(id,d){ return pdb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").put(d,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function photoGet(id){ return pdb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("photos","readonly"); const r=tx.objectStore("photos").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); })); }
function photoDel(id){ return pdb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function photoAll(){ return pdb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("photos","readonly"); const out={}; const r=tx.objectStore("photos").openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); })); }
function photoClearAll(){ return pdb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function fileToDataUrl(file,maxSide=720,quality=0.5){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ let w=img.width,h=img.height; if(Math.max(w,h)>maxSide){ const r=maxSide/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    try{ res(cv.toDataURL("image/jpeg",quality)); }catch(e){ rej(e); } };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; img.src=url; }); }

/* ---------- share card ---------- */
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function CF(sz,w){ return (w||"400")+" "+sz+"px -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"; }
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapLines(ctx,text,font,firstW,restW){ ctx.font=font; const lines=[]; let cur="",maxW=firstW;
  for(const ch of text){ const test=cur+ch; if(cur!=="" && ctx.measureText(test).width>maxW){ lines.push(cur); cur=ch; maxW=restW; } else cur=test; }
  if(cur!=="") lines.push(cur); return lines.length?lines:[""]; }
function drawCover(ctx,img,x,y,w,h,r){ ctx.save(); rrect(ctx,x,y,w,h,r); ctx.clip(); const ir=img.width/img.height,tr=w/h; let sw,sh,sx,sy;
  if(ir>tr){sh=img.height;sw=sh*tr;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=sw/tr;sx=0;sy=(img.height-sh)/2;} ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h); ctx.restore(); }
async function generateShareCard(){
  const S=2,LW=420,M=16,CP=20,NAMEH=16,DETH=15,ROWGAP=7,IND=6;
  const cardX=M, innerX=cardX+CP, cardW=LW-2*M, innerW=cardW-2*CP, innerR=innerX+innerW;
  const d=parseD(cursor), wk=["일","월","화","수","목","금","토"][d.getDay()];
  const dateLabel=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} (${wk})`;
  const list=dayData(cursor).workouts;
  const s=summarize(cursor);
  // photos (up to 3)
  const ids=(dayData(cursor).photos||[]).slice(0,3); const photos=[];
  for(const id of ids){ let du=null; try{ du=await photoGet(id); }catch(e){} if(du){ try{ photos.push(await loadImg(du)); }catch(e){} } }

  const cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  cv.width=LW*S; cv.height=10; ctx.scale(S,S);
  const rows=list.map(w=>({ icon:wIcon(w.type), name:w.name, detail:workoutDetail(w),
    nameLines:wrapLines(ctx, wIcon(w.type)+" "+w.name, CF(14,"600"), innerW-IND, innerW-IND) }));

  const PHS = photos.length ? Math.round(Math.min(120,(innerW-(photos.length-1)*8)/photos.length)) : 0;
  let h=M+CP+52+14;
  if(photos.length) h+=PHS+16;
  h+=1+12;
  if(rows.length){ rows.forEach(r=>{ h+=r.nameLines.length*NAMEH+DETH+ROWGAP; }); } else h+=24;
  h+=CP+M;
  const LH=h;
  cv.height=LH*S; ctx.setTransform(1,0,0,1,0,0); ctx.scale(S,S); ctx.textBaseline="alphabetic";

  ctx.fillStyle="#eef0f3"; ctx.fillRect(0,0,LW,LH);
  rrect(ctx,cardX,M,cardW,LH-2*M,16); ctx.fillStyle="#fff"; ctx.fill(); ctx.strokeStyle="#e8ebf0"; ctx.lineWidth=1; ctx.stroke();
  let y=M+CP;
  ctx.textAlign="left"; ctx.fillStyle="#8a8f98"; ctx.font=CF(13); ctx.fillText("운동 기록", innerX, y+13);
  ctx.fillStyle="#1c1e21"; ctx.font=CF(18,"600"); ctx.fillText(dateLabel, innerX, y+36);
  ctx.fillStyle="#3f6fd6"; ctx.font=CF(13,"600"); ctx.fillText(summaryText(cursor), innerX, y+54);
  y+=52+14;
  if(photos.length){ photos.forEach((im,i)=>{ drawCover(ctx,im,innerX+i*(PHS+8),y,PHS,PHS,8); }); y+=PHS+16; }
  ctx.strokeStyle="#f0f2f5"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(innerX,y); ctx.lineTo(innerR,y); ctx.stroke(); y+=1+12;
  if(rows.length){ rows.forEach(r=>{ ctx.textAlign="left"; ctx.fillStyle="#1c1e21"; ctx.font=CF(14,"600");
      r.nameLines.forEach((ln,i)=>ctx.fillText(ln, innerX, y+13+i*NAMEH));
      const yy=y+r.nameLines.length*NAMEH; ctx.fillStyle="#8a8f98"; ctx.font=CF(12); ctx.fillText(r.detail, innerX+IND, yy+11);
      y=yy+DETH+ROWGAP; });
  } else { ctx.textAlign="center"; ctx.fillStyle="#b3b8bf"; ctx.font=CF(14); ctx.fillText("이 날은 운동 기록이 없어요", innerX+innerW/2, y+14); y+=24; }
  return await new Promise(res=>cv.toBlob(res,"image/png",0.92));
}
async function shareDay(){
  try{ toast("이미지 만드는 중…"); const blob=await generateShareCard(); const file=new File([blob],`운동_${cursor}.png`,{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"운동 기록",text:`${cursor} 운동 기록`}); }
    else { const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast("이미지를 저장했어요"); }
  }catch(e){ console.error(e); toast("공유에 실패했어요"); }
}

<script>
function srcFor(id){
  var el=document.getElementById(id);
  // restore the escaped closing tags before handing HTML to the iframe
  return el.textContent.replace(/<\\\/script>/g, "<\/script>");
}
var frames={
  daily:{ el:document.getElementById("f-daily"), src:"src-daily", loaded:false, reload:true },
  diary:{ el:document.getElementById("f-diary"), src:"src-diary", loaded:false, reload:false },
  diet:{ el:document.getElementById("f-diet"), src:"src-diet", loaded:false, reload:false },
  workout:{ el:document.getElementById("f-workout"), src:"src-workout", loaded:false, reload:false }
};
var current="daily";
function ensureLoaded(name){
  var f=frames[name];
  if(!f.loaded){ f.el.srcdoc=srcFor(f.src); f.loaded=true; }
  else if(f.reload){ try{ f.el.contentWindow.location.reload(); }catch(e){ f.el.srcdoc=srcFor(f.src); } }
}
function activate(name){
  current=name;
  Object.keys(frames).forEach(function(k){ frames[k].el.classList.toggle("on", k===name); });
  document.querySelectorAll(".tabbar button").forEach(function(b){ b.classList.toggle("on", b.dataset.tab===name); });
  ensureLoaded(name);
}
document.querySelectorAll(".tabbar button").forEach(function(b){
  b.onclick=function(){ activate(b.dataset.tab); };
});
// initial: load daily (home)
activate("daily");
</script>
